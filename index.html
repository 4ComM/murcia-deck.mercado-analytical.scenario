/* Deck Real Murcia, versão computador (05/11/2026). Palco 1440x900; a tela nunca rola; o detalhe abre por cima da grade. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#08080A;overflow:hidden}
body.dk{--ink:#08080A;--panel:#121217;--panel2:#1A1A21;--deep:#0E0E13;--line:#2A2A33;--line2:#1C1C24;--hover:#4A4A58;--text:#EDEDF0;--soft:#B9B9C4;--muted:#8E8E9A;--gold:#E8B84B;--red:#D03B3B;--alta:#16C47F;--evo:#4CC2FF;--alerta:#F5A524;--B:'Chakra Petch','Segoe UI',Arial,sans-serif;color:var(--text);font:500 13.5px/1.45 var(--B);-webkit-font-smoothing:antialiased}
button{font-family:var(--B);cursor:pointer;color:inherit}
a{color:inherit}
b{font-weight:700}
#pcPalco{position:fixed;left:0;top:0;width:1440px;height:900px;display:flex;flex-direction:column;background:var(--ink);transform-origin:0 0}

/* moldura */
.bar{height:44px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line2);background:#0B0B0E}
.bar .lg{height:26px;width:auto;display:block;cursor:pointer}
.bar .xx{color:var(--muted);font:600 12px var(--B)}
.bar .es{height:26px;width:26px;object-fit:contain}
.mn{display:flex;align-items:center;gap:1px;margin-left:6px;flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.mn button{background:none;border:0;font:600 11.5px var(--B);color:var(--muted);padding:6px 5px;letter-spacing:.02em;position:relative}
.mn button:hover{color:#fff}
.mn button.on{color:#fff}
.mn button.on::after{content:"";position:absolute;left:7px;right:7px;bottom:0;height:2px;background:var(--gold)}
.mn .gr{color:#6c6c78;font:700 9.5px var(--B);letter-spacing:.1em;text-transform:uppercase;padding:0 2px 0 7px}
.langs{display:flex;gap:2px;flex:none}
.langs button{background:none;border:0;padding:5px 7px;font:700 11px var(--B);letter-spacing:.08em;color:var(--muted);border-radius:6px}
.langs button.on{color:#fff;background:#23232b}
.nv{height:32px;flex:none;display:flex;align-items:center;justify-content:center;gap:12px;border-top:1px solid var(--line2);background:#0B0B0E}
.nv button.ar{background:none;border:0;color:var(--soft);font:700 15px var(--B);width:36px;height:28px;border-radius:6px}
.nv button.ar:hover{background:#23232b;color:#fff}
.nv .dots{display:flex;gap:5px}
.nv .dots i{width:18px;height:4px;border-radius:2px;background:#2c2c35;cursor:pointer;display:block}
.nv .dots i.on{background:var(--red)}
.nv .ct{font:600 11px var(--B);color:var(--muted);width:48px;font-variant-numeric:tabular-nums}
.tl{flex:1;min-height:0;position:relative}
.dk-s{position:absolute;inset:0;display:none}
.dk-s.on{display:block}
.dk-s::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--red);z-index:1}
.dk-b{position:absolute;inset:0;padding:15px 22px 12px;display:flex;flex-direction:column;gap:11px;overflow:hidden}

/* títulos: sempre uma linha, sem caixa */
.hd{flex:none;display:flex;align-items:flex-end;gap:24px}
.hd .tt{flex:1;min-width:0}
.kick{font:700 12.5px/1 var(--B);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
h2.ttl{font:700 37px/1.03 var(--B);letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.sb{font:500 14px/1.35 var(--B);color:var(--soft);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{font:700 12.5px/1 var(--B);letter-spacing:.1em;text-transform:uppercase;color:var(--text)}
.rt{font:700 10.5px/1.2 var(--B);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.nt{font:500 11.5px/1.4 var(--B);color:var(--muted)}
.tx{font:500 13.5px/1.5 var(--B);color:var(--soft)}
.tx b{color:var(--text)}
.gold{color:var(--gold)}
.tn{font-variant-numeric:tabular-nums}

/* animação */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{opacity:0}
.rise-on{animation:rise .65s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms);opacity:1}
.cresce{transform:scaleX(0);transform-origin:left center;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.cresce.on{transform:none}
.cresce.v{transform:scaleY(0);transform-origin:center bottom}
.cresce.v.on{transform:none}
@media (prefers-reduced-motion:reduce){.rise,.rise-on{opacity:1;animation:none}.cresce{transform:none;transition:none}}

/* cartão expansível */
.xc{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;transition:border-color .25s,transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,opacity .45s,filter .45s}
.xc::after{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:3px;background:var(--acc,var(--gold));border-radius:12px 12px 0 0;transform:scaleX(0);transform-origin:left center;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.xc:hover{border-color:#4a4a58;transform:translateY(-3px)}
.xc:hover::after{transform:scaleX(1)}
.xg{position:relative;display:grid;min-height:0}
.xp{cursor:pointer;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.xp-ph{visibility:hidden}
.xp.aberto{z-index:5;cursor:default;transform:none;transition:left .4s cubic-bezier(.2,.8,.2,1),top .4s cubic-bezier(.2,.8,.2,1),width .4s cubic-bezier(.2,.8,.2,1),height .4s cubic-bezier(.2,.8,.2,1);box-shadow:0 30px 90px #000;border-color:#34343f;background:var(--panel)}
.xp.aberto::after{transform:scaleX(1)}
.xp .xp-det{display:none;opacity:0}
.xp.aberto .xp-det{display:block;flex:1;min-height:0;opacity:1;transition:opacity .3s .18s}
.xp.aberto .xp-cl{display:none !important}
.xp .xp-fecha{display:none;position:absolute;top:10px;right:10px;width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--soft);font:700 16px var(--B);z-index:3}
.xp.aberto .xp-fecha{display:block}
.vc .mais{top:13px;bottom:auto}
.xp .mais{position:absolute;right:11px;bottom:9px;font:700 10px var(--B);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.xp:hover .mais{color:var(--gold)}
.xg.foco .xp:not(.aberto){opacity:.2;filter:saturate(.3)}
.xg.foco>*:not(.xp):not(.pf-fts){opacity:.2;filter:saturate(.3);transition:opacity .4s}

/* controles */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{background:var(--panel);border:0;padding:6px 11px;font:600 12px var(--B);color:var(--muted);white-space:nowrap}
.seg button:hover{color:#fff}
.seg button.on{background:#2a1117;color:#fff}
.seg.pq button{padding:4px 9px;font-size:11.5px}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pls{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 10px;font:600 11.5px var(--B);color:var(--soft);white-space:nowrap}
.pls.on{border-color:var(--red);color:#fff;background:#2a1117}
.pls b{color:var(--gold);margin-left:4px}
.pitch{display:block;width:100%;height:100%;background:linear-gradient(#17242a,#111c21);border-radius:10px}
.ln{fill:none;stroke:#fff;stroke-opacity:.26;stroke-width:1}

/* trilhas */
.fm{padding:4px 0 5px;border-bottom:1px solid var(--line2)}
.fm .fn{display:flex;justify-content:space-between;gap:6px;font:600 12px/1.25 var(--B);color:var(--soft)}
.fm .fn b{color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.fm .fn b small{font:600 10.5px var(--B);color:var(--muted);margin-left:5px}
.trk{position:relative;height:6px;background:#22222b;border-radius:4px;margin-top:4px}
.trk i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.ag5{font:700 11px var(--B);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:9px 0 2px}
.ag5:first-child{margin-top:0}
.mr{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;padding:6px 4px;font:500 13px var(--B);color:var(--soft);border-bottom:1px solid var(--line2)}
.mr.ele{color:var(--text);font-weight:700;background:#2a1f08;border-radius:5px}
.mr i{font-style:normal;color:var(--muted);font-weight:700}
.mr b{color:var(--gold);font-variant-numeric:tabular-nums}
.mr span small{color:var(--muted);font:500 11px var(--B);margin-left:5px}

/* tooltip */
#tip{position:fixed;z-index:60;pointer-events:none;background:#0e0e13;border:1px solid #34343f;border-radius:8px;padding:6px 9px;font:600 12px/1.35 var(--B);color:var(--text);box-shadow:0 14px 40px #000;display:none;max-width:280px}

/* capa */
.cp{display:flex;flex-direction:column;height:100%;gap:12px}
.cp-t{flex:none;display:flex;align-items:center;gap:24px}
.cp-lg{display:flex;align-items:center;gap:14px;flex:none}
.cp-lg img.l{height:52px}
.cp-lg img.e{height:56px;width:56px;object-fit:contain}
.cp-lg span{font:600 16px var(--B);color:var(--muted)}
.cp-tx{flex:1;min-width:0}
.cp-tx h1{font:700 38px/1.03 var(--B);text-transform:uppercase;white-space:nowrap;overflow:hidden}
.cp-tx p{font:500 14.5px/1.35 var(--B);color:var(--soft);margin-top:5px}
.cp-g{flex:1;min-height:0;grid-template-columns:1fr 1fr;gap:14px}
.cc{padding:12px;flex-direction:row;gap:14px;background:radial-gradient(70% 90% at 12% 40%,rgba(208,59,59,.14),transparent 70%),var(--panel)}
.xp.cc{display:flex}
.cc-f{flex:none;width:45%;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#25252e,#101014);position:relative}
.cc-f img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.cc:hover .cc-f img{transform:scale(1.03)}
.cc-f .nb{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 12px;background:linear-gradient(transparent,rgba(8,8,10,.92))}
.cc-f .nb h3{font:700 32px/1 var(--B);text-transform:uppercase;white-space:nowrap}
.cc-f .nb span{font:600 13px var(--B);color:var(--gold)}
.cc-d{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;position:relative}
.cc-ig{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cc-ig>div{background:var(--deep);border:1px solid var(--line);border-radius:9px;padding:6px 9px;display:flex;align-items:center;gap:7px;min-height:44px}
.cc-ig img,.cc-ig svg.fl{width:24px;height:24px;object-fit:contain;flex:none}
.cc-ig svg.fl{height:17px}
.cc-ig b{display:block;font:700 13px/1.15 var(--B)}
.cc-ig small{display:block;font:600 9.5px/1.2 var(--B);color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
.cc-kp{display:flex;flex-direction:column;gap:0;flex:1;min-height:0}
.cc-kp>div{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:center;border-top:1px solid var(--line2);flex:1}
.cc-kp b{font:700 41px/1 var(--B);color:var(--gold);font-variant-numeric:tabular-nums}
.cc-kp span{font:500 14px/1.32 var(--B);color:var(--soft)}
.cc-mini{height:158px;flex:none;display:grid;grid-template-columns:228px 1fr;gap:12px;align-items:center;border-top:1px solid var(--line2);padding-top:9px}
.cc-mini .tx{font-size:13.5px;line-height:1.38}
.cc-x{display:grid;grid-template-columns:38% 1fr;gap:22px;height:100%;min-height:0}
.cc-x .ph{min-height:0}
.cc-x .ph{border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#25252e,#101014)}
.cc-x .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
.cc-x h3{font:700 36px/1 var(--B);text-transform:uppercase;margin-bottom:6px}
.cc-x ul{list-style:none;margin:10px 0}
.cc-x li{position:relative;padding:9px 0 9px 18px;border-top:1px solid var(--line2);font:500 15px/1.4 var(--B);color:var(--soft)}
.cc-x li b{color:var(--text)}
.cc-x li::before{content:"";position:absolute;left:0;top:17px;width:10px;height:2px;background:var(--gold)}
.lk{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lk button{background:var(--red);border:0;color:#fff;font:700 12px var(--B);padding:8px 13px;border-radius:8px;letter-spacing:.03em}
.lk button.s{background:var(--panel2);border:1px solid var(--line)}
.cp-pl{flex:none;display:flex;align-items:center;gap:12px;padding:7px 12px;background:var(--deep);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.cp-pl:hover{border-color:#4a4a58}
.cp-pl img{height:42px;width:42px;border-radius:50%;object-fit:cover;object-position:50% 10%;background:#23232b}
.cp-pl b{font:700 15px var(--B)}
.cp-pl span{font:500 13px/1.3 var(--B);color:var(--soft)}
.cp-pl em{margin-left:auto;font:500 11.5px var(--B);color:var(--muted);font-style:normal}

/* clube */
.fx{flex:none;display:flex;gap:18px;align-items:center;padding:0 2px}
.fx>div{display:flex;align-items:baseline;gap:6px}
.fx b{font:700 21px var(--B);font-variant-numeric:tabular-nums}
.fx span{font:600 11px var(--B);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.vf{flex:1;min-height:0;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:1fr 1fr;gap:11px}
.vc{--acc:var(--gold)}
.vc.fr{--acc:#8E8E9A}
.vc .tp{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.vc .ro{font:700 10.5px var(--B);letter-spacing:.13em;text-transform:uppercase;color:var(--gold)}
.vc.fr .ro{color:#A9A9B5}
.vc .nb{font:700 50px/1 var(--B);color:var(--gold);margin-top:3px}
.vc.fr .nb{color:var(--text)}
.vc .nb small{font:700 15px var(--B);color:var(--muted);margin-left:5px}
.vc h4{font:700 15.5px/1.2 var(--B);margin-top:5px}
.vc p{font:500 12.5px/1.35 var(--B);color:var(--soft);margin-top:3px}
.vc .sp{flex:1;min-height:0;margin-top:7px;display:flex;align-items:flex-end;gap:3px}
.vc .sp i{flex:1;background:#34343f;border-radius:2px 2px 0 0;display:block}
.vc .sp i.m{background:var(--gold)}
.vc.fr .sp i.m{background:#EDEDF0}
.vx{display:grid;grid-template-columns:360px 1fr;gap:24px;height:100%}
.vx .nb{font-size:72px}
.vx .tx{margin-top:8px;font-size:14.5px}
.rk20{display:grid;grid-auto-flow:column;grid-template-rows:repeat(10,1fr);grid-template-columns:1fr 1fr;gap:3px 22px;height:100%}
.rk{display:grid;grid-template-columns:22px 142px 1fr 44px;gap:7px;align-items:center;font:500 12px var(--B);color:var(--soft)}
.rk i{font-style:normal;color:var(--muted);font-weight:700}
.rk u{display:block;height:9px;background:#34343f;border-radius:0 3px 3px 0;text-decoration:none}
.rk b{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.rk.m{color:#fff;font-weight:700}
.rk.m u{background:var(--gold)}
.rk.m b{color:var(--gold)}
.rk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* carências */
.lc{flex:1;min-height:0;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.lc-c{padding:0;--acc:var(--gold)}
.lc-f{height:216px;flex:none;position:relative;background:radial-gradient(70% 90% at 50% 30%,rgba(208,59,59,.2),transparent 70%),#17171d;overflow:hidden}
.lc-f img{width:100%;height:100%;object-fit:cover;object-position:50% 10%;display:block}
.lc-f .lb{position:absolute;left:0;right:0;bottom:0;padding:30px 13px 9px;background:linear-gradient(transparent,rgba(8,8,10,.95));display:flex;justify-content:space-between;align-items:flex-end}
.lc-f .lb b{font:700 19px var(--B);text-transform:uppercase}
.lc-f .lb span{font:700 10px var(--B);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.lc-b{padding:11px 13px 26px;display:flex;flex-direction:column;gap:7px;flex:1;min-height:0}
.lc-b h4{font:700 16.5px/1.2 var(--B)}
.lc-b p{font:500 12.5px/1.38 var(--B);color:var(--soft)}
.lc-v{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:7px}
.lc-g{font:700 44px/1 var(--B);color:var(--gold);font-variant-numeric:tabular-nums}
.lc-g small{font:600 12.5px/1.25 var(--B);color:var(--soft);display:block;margin-top:3px}
.lc-b .rsp{border-top:1px solid var(--line);padding-top:7px;font:600 13px/1.35 var(--B);color:var(--text)}
.lc-b .rsp b{display:block;font:700 10px var(--B);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.lnr{position:relative;height:30px}
.lnr .ax{position:absolute;left:0;right:0;top:14px;height:2px;background:#2c2c35}
.lnr .pt{position:absolute;top:6px;width:18px;height:18px;margin-left:-9px;border-radius:50%;display:grid;place-items:center;font:700 9.5px var(--B);background:#34343f;color:#fff}
.lnr .pt.g{background:var(--gold);color:#08080a}
.lnr-r{display:grid;grid-template-columns:88px 1fr;gap:7px;align-items:center;font:600 11px var(--B);color:var(--soft)}
.balls{display:flex;gap:4px;flex-wrap:wrap}
.balls i{width:22px;height:22px;border-radius:50%;background:#2c2c35;display:block}
.balls i.g{background:var(--gold)}
.mb{display:grid;grid-template-columns:96px 1fr 38px;gap:6px;align-items:center;font:600 12px var(--B);color:var(--soft);padding:2px 0}
.mb u{display:block;height:9px;background:#3b3b46;border-radius:0 3px 3px 0;text-decoration:none}
.mb.g u{background:var(--gold)}
.mb b{text-align:right;font-variant-numeric:tabular-nums}
.tri{display:grid;grid-template-columns:1fr auto;font:600 12px/1.65 var(--B);color:var(--soft);border-bottom:1px solid var(--line2)}
.tri b{color:var(--muted);font-weight:600}
.lc-x{display:grid;grid-template-columns:330px 1fr;gap:22px;height:100%;margin:-11px -13px -26px;padding:0}
.lc-x .im{background:radial-gradient(70% 90% at 50% 30%,rgba(208,59,59,.2),transparent 70%),#17171d;height:100%;overflow:hidden}
.lc-x .im img{width:100%;height:100%;object-fit:cover;object-position:50% 10%}
.lc-x .tt{padding:22px 40px 16px 0;overflow:hidden}
.lc-x h3{font:700 30px/1.1 var(--B);margin-bottom:10px}
.lc-x .rs{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.lc-x .nbb{display:flex;gap:26px;margin-top:10px}
.lc-x .nbb b{display:block;font:700 44px/1 var(--B);color:var(--gold)}
.lc-x .nbb span{font:500 12.5px/1.3 var(--B);color:var(--soft);display:block;max-width:200px;margin-top:4px}

/* treinador */
.tr-g{flex:1;min-height:0;display:grid;gap:11px;grid-template-columns:300px minmax(0,1fr) 350px;grid-template-rows:minmax(0,1fr) 108px}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;position:relative}
.pn.dp{background:var(--deep)}
.pn-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex:none;min-height:24px}
.tr-p{grid-row:1/3;padding:0;overflow:hidden}
.tr-p .im{height:400px;flex:none;position:relative;overflow:hidden}
.tr-p .im img{width:100%;height:100%;object-fit:cover;object-position:62% 20%;display:block}
.tr-p .im .nb{position:absolute;left:0;right:0;bottom:0;padding:50px 14px 10px;background:linear-gradient(transparent,rgba(8,8,10,.94))}
.tr-p .im h3{font:700 27px/1 var(--B);text-transform:uppercase}
.tr-p .im span{font:600 12px var(--B);color:var(--gold)}
.tr-p .ct{padding:11px 14px;display:flex;flex-direction:column;gap:7px;flex:1;min-height:0}
.qt{font:600 16px/1.3 var(--B);color:var(--text);border-left:3px solid var(--gold);padding-left:11px}
.qt small{display:block;font:500 11px/1.35 var(--B);color:var(--muted);margin-top:4px}
.tl-i{display:grid;grid-template-columns:62px 1fr;gap:9px;font:500 12px/1.3 var(--B);color:var(--soft);padding:3px 0;border-top:1px solid var(--line2)}
.tl-i b{color:var(--text)}
.wdl{display:flex;height:14px;border-radius:3px;overflow:hidden;gap:1px}
.wdl i{display:block;background:#3b3b46}
.wdl i.w{background:var(--gold)}
.wdl i.d{background:#7B7B88}
.wdl i.l{background:#3b3b46}
.hs{display:grid;grid-template-columns:118px 34px 1fr 62px;gap:8px;align-items:center;font:600 12px var(--B);color:var(--soft);padding:4px 0;border-bottom:1px solid var(--line2)}
.hs small{display:block;font:500 10.5px var(--B);color:var(--muted)}
.hs.m b.n{color:#fff}
.hs em{font-style:normal;font:700 11.5px var(--B);text-align:right;font-variant-numeric:tabular-nums}
.leg{display:flex;gap:10px;font:600 10.5px var(--B);color:var(--muted);align-items:center}
.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.vn{display:grid;grid-template-columns:130px 1fr 40px;gap:8px;align-items:center;font:600 12px var(--B);color:var(--soft);padding:3px 0}
.vn .br{position:relative;height:13px;background:var(--deep);border:1px solid var(--line);border-radius:3px}
.vn .br s{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#4a4a58}
.vn .br b{position:absolute;top:2px;bottom:2px;background:var(--gold);border-radius:2px}
.vn .br b.neg{background:#7B7B88}
.vn em{font-style:normal;text-align:right;font:700 12px var(--B);font-variant-numeric:tabular-nums}
.str{display:flex;gap:4px;flex:1;min-height:0}
.gm{flex:1;min-width:0;border-radius:6px;background:var(--panel2);border:1px solid var(--line);padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 10px/1.05 var(--B);color:var(--soft);cursor:default;text-align:center}
.gm u{text-decoration:none;display:block;width:12px;height:12px;border-radius:50%}
.gm u.w{background:var(--gold)}
.gm u.d{background:#7B7B88}
.gm u.l{background:#101014;border:1.5px solid #6E6E7C}
.gm.nd{color:#6c6c78}
.gm.lig{border-color:#4a4a58;background:#20202a;color:#fff}
.gm:hover{border-color:var(--gold)}
.gm small{font:600 8.5px var(--B);color:var(--muted)}

/* perfil */
.pf{flex:1;min-height:0;display:grid;gap:11px;grid-template-columns:272px minmax(0,1fr) 300px;grid-template-rows:64px 112px 184px minmax(0,1fr);grid-template-areas:"id cab attr" "id sin attr" "id fts attr" "id trj attr"}
.pf-id{grid-area:id;padding:10px}
.pf-id .ph{flex:none;height:326px;border-radius:12px;overflow:hidden;position:relative;background:radial-gradient(70% 80% at 50% 30%,rgba(208,59,59,.26),transparent 70%),#17171d}
.pf-id .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.dl>div{background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-width:0}
.dl small{display:block;font:600 9.5px/1.2 var(--B);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.dl b{display:flex;align-items:center;gap:5px;font:700 12.5px/1.25 var(--B)}
.dl b img,.dl b svg{height:16px;width:18px;object-fit:contain;flex:none}
.dl>div:first-child,.dl>div:last-child{grid-column:1/3}
.pf-mc{flex:1;min-height:0;position:relative}
.pf-cab{grid-area:cab;display:flex;align-items:center;gap:16px;min-width:0}
.pf-cab .nm{flex:1;min-width:0}
.pf-cab h2{font:700 41px/1 var(--B);text-transform:uppercase;white-space:nowrap;overflow:hidden}
.pf-cab p{font:500 13.5px/1.25 var(--B);color:var(--soft);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovn{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:132px;height:62px;border-radius:12px;background:var(--deep);border:2px solid var(--gold)}
.ovn b{font:700 27px/1 var(--B);color:var(--gold)}
.ovn small{color:var(--muted);font:700 9px/1.1 var(--B);letter-spacing:.1em;margin-top:2px;text-transform:uppercase;text-align:center}
.pf-tb{display:flex;gap:6px;flex:none}
.pf-sin{grid-area:sin;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;min-width:0}
.sg{background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:8px 11px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.sg small{font:700 10px/1.15 var(--B);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.sg .kn{font:700 22px/1.1 var(--B);margin-top:2px;font-variant-numeric:tabular-nums}
.sg .kc{font:500 11.5px/1.25 var(--B);color:var(--soft)}
.sg svg{display:block;width:100%;flex:1;min-height:0;margin-top:4px}
.sgb{display:flex;gap:2px;flex:1;min-height:0;margin-top:4px;border-radius:4px;overflow:hidden}
.sgb div{display:flex;align-items:center;justify-content:center;font:700 10.5px var(--B);background:#3b3b46;color:#EDEDF0;min-height:14px}
.sgb div.g{background:var(--gold);color:#08080a}
.pf-fts{display:grid;grid-area:fts;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ft1{--acc:var(--gold);background:var(--deep);padding:11px 13px;border-top:3px solid var(--gold)}
.ft1 .nb{font:700 40px/1 var(--B);color:var(--gold);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.ft1 .nb small{font:700 12.5px var(--B);color:var(--muted)}
.ft1 .fr1{font:600 14px/1.27 var(--B);margin-top:5px}
.ft1 .pe{color:var(--muted);font:500 11.5px/1.3 var(--B);margin-top:4px}
.ft-x{display:grid;grid-template-columns:400px minmax(0,560px);gap:40px;height:100%;padding:18px;align-content:start}
.ft-x .fr1{margin-top:12px}
.ft-x .nb{font-size:80px}
.pf-trj{grid-area:trj;gap:6px}
.pf-at{grid-area:attr;overflow:hidden;gap:3px;padding:10px 12px}
.tjb{display:flex;gap:6px;align-items:flex-end;min-width:0;flex:1;min-height:0}
.tjb-c{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-radius:8px;padding:2px 0}
.tjb-c:hover{background:#1c1c24}
.tjb-c.on{background:#20202a}
.tjb-c b{font:700 11px var(--B);color:var(--soft);font-variant-numeric:tabular-nums}
.tjb-p{display:flex;align-items:flex-end;width:100%;justify-content:center}
.tjb-b{width:min(100%,42px);display:flex;flex-direction:column;gap:2px}
.tjb-b i{display:block;min-height:2px;background:#6E6E7C}
.tjb-b i:first-child{border-radius:4px 4px 0 0}

  palco.style.transform = 'scale(' + k + ')'; palco.style.width = (innerWidth / k) + 'px'; palco.style.height = (innerHeight / k) + 'px';
}

/* animação */
const REDUZ = matchMedia('(prefers-reduced-motion:reduce)').matches;
function contaNumero(el, ms) {
  const alvo = el.dataset.n, en = lang === 'en', re = en ? /^([^\d-]*)(-?[\d,]*\d(?:\.\d+)?)(.*)$/ : /^([^\d-]*)(-?[\d.]*\d(?:,\d+)?)(.*)$/, m = re.exec(alvo);
  if (!m || REDUZ) { el.textContent = alvo; return; }
  const sD = en ? '.' : ',', sM = en ? ',' : '.', dec = (m[2].split(sD)[1] || '').length, fim = parseFloat(m[2].split(sM).join('').replace(',', '.')), mil = m[2].includes(sM);
  const fmt = v => v.toLocaleString(en ? 'en-GB' : 'de-DE', {minimumFractionDigits: dec, maximumFractionDigits: dec, useGrouping: mil});
  const t0 = performance.now();
  (function passo(t) { const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3); el.textContent = m[1] + fmt(fim * e) + m[3]; if (p < 1) requestAnimationFrame(passo); else el.textContent = alvo; })(t0);
}
function anima(tela) {
  tela.querySelectorAll('.rise').forEach((el, i) => { el.style.setProperty('--i', Math.min(i, 16)); el.classList.remove('rise-on'); void el.offsetWidth; el.classList.add('rise-on'); });
  tela.querySelectorAll('[data-n]').forEach(el => contaNumero(el, 850));
  animaBarras(tela);
  tela.querySelectorAll('.sc').forEach(sc => { sc.classList.remove('on'); void sc.getBoundingClientRect(); sc.classList.add('on'); });
}
function animaBarras(r) { r.querySelectorAll('.cresce').forEach((el, i) => { el.style.transitionDelay = Math.min(100 + i * 18, 500) + 'ms'; el.classList.remove('on'); void el.offsetWidth; el.classList.add('on'); }); }
function umaLinha(el, minPx) {
  el.style.whiteSpace = 'nowrap'; el.style.fontSize = '';
  let px = parseFloat(getComputedStyle(el).fontSize); const piso = minPx || 22;
  while (el.scrollWidth > el.clientWidth + 1 && px > piso) { px -= 1; el.style.fontSize = px + 'px'; }
}

/* cartão expansível: abre por cima da grade; a tela nunca rola */
document.addEventListener('click', e => {
  if (e.target.closest('.xp-fecha')) { xpFecha(e.target.closest('.xp')); e.stopPropagation(); return; }
  const go = e.target.closest('[data-vai]'); if (go) { e.stopPropagation(); document.querySelectorAll('.xp.aberto').forEach(xpFecha); dkVaiId(go.dataset.vai); return; }
  if (e.target.closest('button,a,video,.seg,.pills')) return;
  const c = e.target.closest('.xp'); if (!c || c.classList.contains('aberto')) return; xpAbre(c);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { document.querySelectorAll('.xp.aberto').forEach(xpFecha); return; }
  if (e.target.tagName === 'VIDEO') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') dkVai(atual + 1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') dkVai(atual - 1);
});
function xpAbre(c) {
  const g = c.closest('.xg'), gr = g.getBoundingClientRect(), r = c.getBoundingClientRect(), k = gr.width / g.offsetWidth;
  g.querySelectorAll('.xp.aberto').forEach(xpFecha);
  const ph = document.createElement('div'); ph.className = 'xp-ph'; c.before(ph); c._ph = ph;
  const de = {left: (r.left - gr.left) / k, top: (r.top - gr.top) / k, width: r.width / k, height: r.height / k};
  Object.assign(c.style, {position: 'absolute', left: de.left + 'px', top: de.top + 'px', width: de.width + 'px', height: de.height + 'px'});
  c._de = de; c.classList.add('aberto'); g.classList.add('foco'); void c.offsetWidth;
  Object.assign(c.style, {left: 0, top: 0, width: '100%', height: '100%'});
  animaBarras(c);
}
function xpFecha(c) {
  const g = c.closest('.xg'), de = c._de; if (!de) return;
  Object.assign(c.style, {left: de.left + 'px', top: de.top + 'px', width: de.width + 'px', height: de.height + 'px'});
  g.classList.remove('foco'); c._de = null;
  setTimeout(() => { c.classList.remove('aberto'); c.removeAttribute('style'); if (c._ph) { c._ph.remove(); c._ph = null; } }, 420);
}

function gradeH(g) {
  const mx = Math.max(1, ...g.flat()); let s = '';
  g.forEach((lin, r) => lin.forEach((n, c) => { if (!n) return; const t = n / mx; let k = 0; DEG.forEach((d, i) => { if (t >= d) k = i + 1; }); s += `<rect x="${(29 - r) * 10}" y="${c * 10}" width="10" height="10" fill="${COR_H[k]}" data-tip="${n}"/>`; }));

/* rosa dos ventos: 16 setores; setor 0 para a frente, sentido horário; área externa = tentados, ouro = certos */
function rosa(setores, W = 250) {
  const c = W / 2, R = c - 26, mx = Math.max(1, ...setores.map(s => s[0])); let s = `<svg viewBox="0 0 ${W} ${W}" style="width:100%;height:100%;display:block">`;
  [.33, .66, 1].forEach(f => { s += `<circle cx="${c}" cy="${c}" r="${R * f}" fill="none" stroke="#fff" stroke-opacity=".08"/>`; });
  const arco = (i, r) => { const a0 = (i * 22.5 - 90 - 10.2) * Math.PI / 180, a1 = (i * 22.5 - 90 + 10.2) * Math.PI / 180; return `M${c} ${c}L${c + r * Math.cos(a0)} ${c + r * Math.sin(a0)}A${r} ${r} 0 0 1 ${c + r * Math.cos(a1)} ${c + r * Math.sin(a1)}Z`; };
  setores.forEach((v, i) => { const r1 = R * Math.sqrt(v[0] / mx), r2 = R * Math.sqrt(v[1] / mx), tip = `${v[1]}/${v[0]}`; if (!v[0]) return; s += `<path d="${arco(i, r1)}" fill="#3b3b46" data-tip="${tip}"/><path d="${arco(i, r2)}" fill="var(--gold)" data-tip="${tip}"/>`; });
  const lab = (x, y, t, a) => `<text x="${x}" y="${y}" text-anchor="${a}" style="font:700 10px var(--B);fill:var(--muted);letter-spacing:.08em;text-transform:uppercase">${t}</text>`;
  return s + lab(c, 12, T('r_fr'), 'middle') + lab(c, W - 3, T('r_tr'), 'middle') + lab(W - 1, c + 3, T('r_di'), 'end') + lab(1, c + 3, T('r_es'), 'start') + '</svg>';
}

/* dispersão com quadrantes e rótulos com linha-guia */
function dispersaoPro(d) {
  const W = d.W || 1000, H = d.H || 640, m = {l: 62, r: 22, t: 16, b: 52}, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const X = v => m.l + (v - d.x.min) / (d.x.max - d.x.min) * iw, Y = v => m.t + ih - (v - d.y.min) / (d.y.max - d.y.min) * ih;
  const cx = X(d.x.corte), cy = Y(d.y.corte), fx = d.x.fmt, fy = d.y.fmt;
  const Q = (x, y, w, h, c) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
  let s = `<svg class="sc" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.x.rot)} / ${esc(d.y.rot)}">`;
  s += Q(cx, m.t, m.l + iw - cx, cy - m.t, 'rgba(232,184,75,.13)') + Q(m.l, m.t, cx - m.l, cy - m.t, 'rgba(76,194,255,.08)') + Q(cx, cy, m.l + iw - cx, m.t + ih - cy, 'rgba(22,196,127,.08)') + Q(m.l, cy, cx - m.l, m.t + ih - cy, 'rgba(255,255,255,.012)');
  const ticks = (a, b, n) => Array.from({length: n + 1}, (_, i) => a + (b - a) * i / n);
  ticks(d.x.min, d.x.max, 5).forEach(v => { s += `<line class="sc-g" x1="${X(v)}" x2="${X(v)}" y1="${m.t}" y2="${m.t + ih}"/><text class="sc-t" x="${X(v)}" y="${m.t + ih + 18}" text-anchor="middle">${fx(v)}</text>`; });
  ticks(d.y.min, d.y.max, 5).forEach(v => { s += `<line class="sc-g" x1="${m.l}" x2="${m.l + iw}" y1="${Y(v)}" y2="${Y(v)}"/><text class="sc-t" x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${fy(v)}</text>`; });
  s += `<line class="sc-c" x1="${cx}" x2="${cx}" y1="${m.t}" y2="${m.t + ih}"/><line class="sc-c" x1="${m.l}" x2="${m.l + iw}" y1="${cy}" y2="${cy}"/>`;
  const qn = (x, y, a, t, c) => t ? `<text class="sc-q ${c || ''}" x="${x}" y="${y}" text-anchor="${a}">${t}</text>` : '';
  if (d.cantos) s += qn(m.l + iw - 12, m.t + 24, 'end', d.quad.ne, 'bom') + qn(m.l + 12, m.t + 24, 'start', d.quad.no) + qn(m.l + iw - 12, m.t + ih - 14, 'end', d.quad.se) + qn(m.l + 12, m.t + ih - 14, 'start', d.quad.so);
  else s += qn(m.l + iw - 12, cy - 12, 'end', d.quad.ne, 'bom') + qn(m.l + 12, cy - 12, 'start', d.quad.no) + qn(m.l + iw - 12, cy + 24, 'end', d.quad.se) + qn(m.l + 12, cy + 24, 'start', d.quad.so);
  s += `<text class="sc-e" x="${m.l + iw / 2}" y="${H - 10}" text-anchor="middle">${d.x.rot} →</text><text class="sc-e" transform="translate(16 ${m.t + ih / 2}) rotate(-90)" text-anchor="middle">${d.y.rot} →</text>`;
  d.pts.forEach((p, i) => { if (p.tipo === 'ctx') s += `<g class="sc-p" style="--d:${(i % 24) * 18}ms" data-tip="${esc(p.tip || p.nome)}"><circle class="hit" cx="${X(p.x)}" cy="${Y(p.y)}" r="11"/><circle class="ctx" cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5"/></g>`; });
  const caixas = [], ptsObs = d.pts.filter(p => p.tipo !== 'ctx').map(p => ({x: X(p.x), y: Y(p.y), r: p.tipo === 'alvo' ? 24 : 12}));
  const bate = (a, b) => !(a.x + a.w < b.x || b.x + b.w < a.x || a.y + a.h < b.y || b.y + b.h < a.y);
  const nomeados = d.pts.filter(p => p.tipo !== 'ctx').sort((a, b) => (a.tipo === 'alvo' ? -1 : 0) - (b.tipo === 'alvo' ? -1 : 0));
  const rotulos = nomeados.map(p => {
    const px = X(p.x), py = Y(p.y), alvo = p.tipo === 'alvo', w = Math.max(p.nome.length, (p.sub || '').length) * (alvo ? 8.6 : 7.1) + 18, h = p.sub ? 38 : 24, r0 = alvo ? 44 : 28;
    let best = null;
    for (const dist of [r0, r0 + 24, r0 + 52, r0 + 90]) {
      for (const a of [-45, -135, 45, 135, 0, 180, -90, 90, -20, -160, 20, 160]) {
        const rad = a * Math.PI / 180, ax = px + dist * Math.cos(rad), ay = py + dist * Math.sin(rad), b = {x: Math.cos(rad) >= 0 ? ax : ax - w, y: ay - h / 2, w, h};
        if (b.x < m.l + 2 || b.x + w > m.l + iw - 2 || b.y < m.t + 2 || b.y + h > m.t + ih - 2) continue;
        if (caixas.some(c => bate(b, c)) || ptsObs.some(o => o.x !== px && bate(b, {x: o.x - o.r, y: o.y - o.r, w: 2 * o.r, h: 2 * o.r}))) continue;
        best = {b, ax: Math.cos(rad) >= 0 ? b.x : b.x + w, ay}; break;
      }
      if (best) break;
    }
    if (!best) { const b = {x: Math.min(px + 30, m.l + iw - w - 2), y: Math.max(py - 40, m.t + 2), w, h}; best = {b, ax: b.x, ay: b.y + h / 2}; }
    caixas.push(best.b);
    return {p, px, py, alvo, ...best, w, h};
  });
  rotulos.forEach((r, i) => { s += `<g class="sc-r ${r.alvo ? 'alvo' : ''}" style="--d:${500 + i * 70}ms" data-tip="${esc(r.p.tip || r.p.nome)}"><path class="sc-guia" pathLength="1" d="M${r.px} ${r.py}L${r.ax} ${r.ay}"/><rect class="sc-cx" x="${r.b.x}" y="${r.b.y}" width="${r.w}" height="${r.h}" rx="4"/><text x="${r.b.x + 9}" y="${r.b.y + 16}" class="sc-n">${esc(r.p.nome)}</text>${r.p.sub ? `<text x="${r.b.x + 9}" y="${r.b.y + 31}" class="sc-s">${esc(r.p.sub)}</text>` : ''}</g>`; });
  d.pts.filter(p => p.tipo !== 'ctx').forEach((p, i) => {
    const a = p.tipo === 'alvo', R = a ? 20 : 7, x = X(p.x), y = Y(p.y), cid = 'scc' + d.id + i;
    s += `<g class="sc-p ${a ? 'alvo' : 'ref'}" style="--d:${300 + i * 60}ms" data-tip="${esc(p.tip || p.nome)}"><circle class="anel" cx="${x}" cy="${y}" r="${R + 2}"/>` + (p.img ? `<clipPath id="${cid}"><circle cx="${x}" cy="${y}" r="${R}"/></clipPath><image href="${p.img}" x="${x - R}" y="${y - R}" width="${2 * R}" height="${2 * R}" clip-path="url(#${cid})" preserveAspectRatio="xMidYMid slice"/>` : `<circle class="mio" cx="${x}" cy="${y}" r="${R - 2}"/>`) + `</g>`;
  });
  return s + '</svg>';
}

/* minutagem por temporada e clube */
function trajBarras(id, tr, H) {
  const tot = t => t.clubes.reduce((s, c) => s + (c.min || 0), 0), mx = Math.max(1, ...tr.map(tot));
  return `<div class="tjb" data-traj="${id}">` + tr.map((t, i) => {
    const seg_ = t.clubes.slice().reverse().map(c => `<i class="${c.atual ? 'at' : ''}" style="flex:${Math.max(c.min || 0, 1)} 0 0" data-tip="${esc(c.nome)} · ${NI(c.min || 0)} min"></i>`).join('');
    const es_ = t.clubes.map(c => c.esc ? `<img src="${A(c.esc)}" alt="" data-tip="${esc(c.nome)}">` : '').join('');
    return `<div class="tjb-c" data-i="${i}"><b>${NI(tot(t))}</b><div class="tjb-p" style="height:${H}px"><div class="tjb-b cresce v" style="height:${Math.max(3, Math.round(H * tot(t) / mx))}px">${seg_}</div></div><span class="tjb-e">${es_}</span><small>${t.ano}${t.parcial ? '*' : ''}</small></div>`;
  }).join('') + '</div>';
}

    <rect x="1" y="1" width="${W - 2}" height="${H - 2}" rx="12" fill="#14211f" stroke="#fff" stroke-opacity=".22"/><g fill="none" stroke="#fff" stroke-opacity=".2"><line x1="${W / 2}" y1="1" x2="${W / 2}" y2="${H - 1}"/><circle cx="${W / 2}" cy="${H / 2}" r="44"/><rect x="1" y="44" width="110" height="${H - 88}"/><rect x="${W - 111}" y="44" width="110" height="${H - 88}"/><rect x="1" y="84" width="36" height="${H - 168}"/><rect x="${W - 37}" y="84" width="36" height="${H - 168}"/></g>
    ${zona(12, 36, T('t3_c1a'), T('t3_c1c'))}${zona(38, 58, T('t3_c2a'), T('t3_c2c'))}${zona(60, 92, T('t3_c3a') + ' · ' + T('t3_c4a'), T('t3_c3c'))}
    ${seta(30, 43.6, 37)}${seta(53, 66, 59.5)}${seta(82, 96, 89)}${f(X(24), 118, 'fe')}${f(X(48), 118, 'pa')}${f(X(76), 118, 'gi')}
  </svg>`;
}
function trio() {

/* ---------- navegação ---------- */
const TELAS = [
  ['capa', capa, 'n_capa', ''], ['clube', clube, 'n_clube', ''], ['carencias', carencias, 'n_car', ''], ['treinador', treinador, 'n_tec', ''],
  ['fe-perfil', () => perfil('fe'), 'n_perfil', 'Felipe'], ['fe-mapas', mapasFe, 'n_mapas', 'Felipe'], ['fe-hero', heroFe, 'n_hero', 'Felipe'], ['fe-video', () => video('fe'), 'n_video', 'Felipe'],
  ['gi-perfil', () => perfil('gi'), 'n_perfil', 'Giovanni'], ['gi-mapas', mapasGi, 'n_mapas', 'Giovanni'], ['gi-hero', heroGi, 'n_hero', 'Giovanni'], ['gi-video', () => video('gi'), 'n_video', 'Giovanni'],
  ['pa-perfil', () => perfil('pa'), 'n_palm', ''], ['trio', trio, 'n_trio', ''], ['formacoes', formacoes, 'n_form', ''], ['passos', passos, 'n_pass', ''], ['contatos', contatos, 'n_cont', '']
];
const dkIds = TELAS.map(t => t[0]);
let atual = 0;
const DEPOIS = {'fe-mapas': mapaTudo, 'fe-hero': () => { heroRk(); heroEv(); }, 'gi-mapas': () => { giPos(); giLista(); }, 'gi-hero': giRk};
function dkVaiId(id) { const i = dkIds.indexOf(id); if (i >= 0) dkVai(i); }
function dkVai(i) {
  if (i < 0 || i >= TELAS.length) return;
  document.querySelectorAll('video').forEach(v => { try { v.pause(); } catch (e) {} });
  atual = i; const s = document.querySelectorAll('.dk-s');
  s.forEach((x, j) => x.classList.toggle('on', j === i));
  document.querySelectorAll('.mn button').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
  document.querySelectorAll('.dots i').forEach((d, j) => d.classList.toggle('on', j === i));
  document.getElementById('ct').textContent = (i + 1) + ' / ' + TELAS.length;
  const tela = s[i]; if (DEPOIS[dkIds[i]]) DEPOIS[dkIds[i]]();
  tela.querySelectorAll('h2.ttl,.cp-tx h1').forEach(h => umaLinha(h));
  anima(tela);
  try { history.replaceState(null, '', '#' + dkIds[i]); } catch (e) {}
}
function montaTudo() {
  document.documentElement.lang = HTMLLANG[lang];
  document.getElementById('tl').innerHTML = TELAS.map(t => `<section class="dk-s" id="s-${t[0]}"><div class="dk-b">${t[1]()}</div></section>`).join('');
  let nv = '', gr = '';
  TELAS.forEach((t, i) => { if (t[3] && t[3] !== gr) { gr = t[3]; nv += `<span class="gr">${gr}</span>`; } else if (!t[3]) gr = ''; nv += `<button data-i="${i}">${T(t[2])}</button>`; });
  document.getElementById('mn').innerHTML = nv;
  document.getElementById('dots').innerHTML = TELAS.map((t, i) => `<i data-i="${i}"></i>`).join('');
  document.getElementById('langs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
}
document.addEventListener('click', e => {
  const m = e.target.closest('.mn button,.dots i'); if (m) dkVai(+m.dataset.i);
  const l = e.target.closest('.langs button'); if (l) { lang = l.dataset.l; try { localStorage.setItem('murcia3_lang', lang); } catch (x) {} montaTudo(); dkVai(atual); }
});
document.addEventListener('DOMContentLoaded', () => {
  pcFit(); montaTudo();
  document.getElementById('prev').onclick = () => dkVai(atual - 1); document.getElementById('next').onclick = () => dkVai(atual + 1);
  const h = location.hash.slice(1); dkVai(Math.max(0, dkIds.indexOf(h)));
});
