/* Deck Real Murcia, versão computador (05/11/2026). Palco 1440x900; a tela nunca rola; o detalhe abre por cima da grade. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#08080A;overflow:hidden}
body.dk{--ink:#08080A;--panel:#121217;--panel2:#1A1A21;--deep:#0E0E13;--line:#2A2A33;--line2:#1C1C24;--hover:#4A4A58;--text:#EDEDF0;--soft:#B9B9C4;--muted:#8E8E9A;--gold:#E8B84B;--red:#D03B3B;--alta:#16C47F;--evo:#4CC2FF;--alerta:#F5A524;--B:'Chakra Petch','Segoe UI',Arial,sans-serif;color:var(--text);font:500 13.5px/1.45 var(--B);-webkit-font-smoothing:antialiased}
button{font-family:var(--B);cursor:pointer;color:inherit}
a{color:inherit}
b{font-weight:700}
#pcPalco{position:fixed;left:0;top:0;width:1440px;height:900px;display:flex;flex-direction:column;background:var(--ink);transform-origin:0 0}

/* moldura */
.bar{height:44px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line2);background:#0B0B0E}
.bar .lg{height:26px;width:auto;display:block;cursor:pointer}
.bar .xx{color:var(--muted);font:600 12px var(--B)}
.bar .es{height:26px;width:26px;object-fit:contain}
.mn{display:flex;align-items:center;gap:1px;margin-left:6px;flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.mn button{background:none;border:0;font:600 11.5px var(--B);color:var(--muted);padding:6px 5px;letter-spacing:.02em;position:relative}
.mn button:hover{color:#fff}
.mn button.on{color:#fff}
.mn button.on::after{content:"";position:absolute;left:7px;right:7px;bottom:0;height:2px;background:var(--gold)}
.mn .gr{color:#6c6c78;font:700 9.5px var(--B);letter-spacing:.1em;text-transform:uppercase;padding:0 2px 0 7px}
.langs{display:flex;gap:2px;flex:none}
.langs button{background:none;border:0;padding:5px 7px;font:700 11px var(--B);letter-spacing:.08em;color:var(--muted);border-radius:6px}
.langs button.on{color:#fff;background:#23232b}
.nv{height:32px;flex:none;display:flex;align-items:center;justify-content:center;gap:12px;border-top:1px solid var(--line2);background:#0B0B0E}
.nv button.ar{background:none;border:0;color:var(--soft);font:700 15px var(--B);width:36px;height:28px;border-radius:6px}
.nv button.ar:hover{background:#23232b;color:#fff}
.nv .dots{display:flex;gap:5px}
.nv .dots i{width:18px;height:4px;border-radius:2px;background:#2c2c35;cursor:pointer;display:block}
.nv .dots i.on{background:var(--red)}
.nv .ct{font:600 11px var(--B);color:var(--muted);width:48px;font-variant-numeric:tabular-nums}
.tl{flex:1;min-height:0;position:relative}
.dk-s{position:absolute;inset:0;display:none}
.dk-s.on{display:block}
.dk-s::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--red);z-index:1}
.dk-b{position:absolute;inset:0;padding:15px 22px 12px;display:flex;flex-direction:column;gap:11px;overflow:hidden}

/* títulos: sempre uma linha, sem caixa */
.hd{flex:none;display:flex;align-items:flex-end;gap:24px}
.hd .tt{flex:1;min-width:0}
.kick{font:700 12.5px/1 var(--B);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
h2.ttl{font:700 37px/1.03 var(--B);letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.sb{font:500 14px/1.35 var(--B);color:var(--soft);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{font:700 12.5px/1 var(--B);letter-spacing:.1em;text-transform:uppercase;color:var(--text)}
.rt{font:700 10.5px/1.2 var(--B);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.nt{font:500 11.5px/1.4 var(--B);color:var(--muted)}
.tx{font:500 13.5px/1.5 var(--B);color:var(--soft)}
.tx b{color:var(--text)}
.gold{color:var(--gold)}
.tn{font-variant-numeric:tabular-nums}

/* animação */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{opacity:0}
.rise-on{animation:rise .65s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms);opacity:1}
.cresce{transform:scaleX(0);transform-origin:left center;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.cresce.on{transform:none}
.cresce.v{transform:scaleY(0);transform-origin:center bottom}
.cresce.v.on{transform:none}
@media (prefers-reduced-motion:reduce){.rise,.rise-on{opacity:1;animation:none}.cresce{transform:none;transition:none}}

/* cartão expansível */
.xc{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;transition:border-color .25s,transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,opacity .45s,filter .45s}
.xc::after{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:3px;background:var(--acc,var(--gold));border-radius:12px 12px 0 0;transform:scaleX(0);transform-origin:left center;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.xc:hover{border-color:#4a4a58;transform:translateY(-3px)}
.xc:hover::after{transform:scaleX(1)}
.xg{position:relative;display:grid;min-height:0}
.xp{cursor:pointer;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.xp-ph{visibility:hidden}
.xp.aberto{z-index:5;cursor:default;transform:none;transition:left .4s cubic-bezier(.2,.8,.2,1),top .4s cubic-bezier(.2,.8,.2,1),width .4s cubic-bezier(.2,.8,.2,1),height .4s cubic-bezier(.2,.8,.2,1);box-shadow:0 30px 90px #000;border-color:#34343f;background:var(--panel)}
.xp.aberto::after{transform:scaleX(1)}
.xp .xp-det{display:none;opacity:0}
.xp.aberto .xp-det{display:block;flex:1;min-height:0;opacity:1;transition:opacity .3s .18s}
.xp.aberto .xp-cl{display:none !important}
.xp .xp-fecha{display:none;position:absolute;top:10px;right:10px;width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--soft);font:700 16px var(--B);z-index:3}
.xp.aberto .xp-fecha{display:block}
.vc .mais{top:13px;bottom:auto}
.xp .mais{position:absolute;right:11px;bottom:9px;font:700 10px var(--B);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.xp:hover .mais{color:var(--gold)}
.xg.foco .xp:not(.aberto){opacity:.2;filter:saturate(.3)}
.xg.foco>*:not(.xp):not(.pf-fts){opacity:.2;filter:saturate(.3);transition:opacity .4s}

/* controles */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{background:var(--panel);border:0;padding:6px 11px;font:600 12px var(--B);color:var(--muted);white-space:nowrap}
.seg button:hover{color:#fff}
.seg button.on{background:#2a1117;color:#fff}
.seg.pq button{padding:4px 9px;font-size:11.5px}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pls{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 10px;font:600 11.5px var(--B);color:var(--soft);white-space:nowrap}
.pls.on{border-color:var(--red);color:#fff;background:#2a1117}
.pls b{color:var(--gold);margin-left:4px}
.pitch{display:block;width:100%;height:100%;background:linear-gradient(#17242a,#111c21);border-radius:10px}
.ln{fill:none;stroke:#fff;stroke-opacity:.26;stroke-width:1}

/* trilhas */
.fm{padding:4px 0 5px;border-bottom:1px solid var(--line2)}
.fm .fn{display:flex;justify-content:space-between;gap:6px;font:600 12px/1.25 var(--B);color:var(--soft)}
.fm .fn b{color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.fm .fn b small{font:600 10.5px var(--B);color:var(--muted);margin-left:5px}
.trk{position:relative;height:6px;background:#22222b;border-radius:4px;margin-top:4px}
.trk i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.ag5{font:700 11px var(--B);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:9px 0 2px}
.ag5:first-child{margin-top:0}
.mr{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;padding:6px 4px;font:500 13px var(--B);color:var(--soft);border-bottom:1px solid var(--line2)}
.mr.ele{color:var(--text);font-weight:700;background:#2a1f08;border-radius:5px}
.mr i{font-style:normal;color:var(--muted);font-weight:700}
.mr b{color:var(--gold);font-variant-numeric:tabular-nums}
.mr span small{color:var(--muted);font:500 11px var(--B);margin-left:5px}

/* tooltip */
#tip{position:fixed;z-index:60;pointer-events:none;background:#0e0e13;border:1px solid #34343f;border-radius:8px;padding:6px 9px;font:600 12px/1.35 var(--B);color:var(--text);box-shadow:0 14px 40px #000;display:none;max-width:280px}

/* capa */
.cp{display:flex;flex-direction:column;height:100%;gap:12px}
.cp-t{flex:none;display:flex;align-items:center;gap:24px}
.cp-lg{display:flex;align-items:center;gap:14px;flex:none}
.cp-lg img.l{height:52px}
.cp-lg img.e{height:56px;width:56px;object-fit:contain}
.cp-lg span{font:600 16px var(--B);color:var(--muted)}
.cp-tx{flex:1;min-width:0}
.cp-tx h1{font:700 38px/1.03 var(--B);text-transform:uppercase;white-space:nowrap;overflow:hidden}
.cp-tx p{font:500 14.5px/1.35 var(--B);color:var(--soft);margin-top:5px}
.cp-g{flex:1;min-height:0;grid-template-columns:1fr 1fr;gap:14px}
.cc{padding:12px;flex-direction:row;gap:14px;background:radial-gradient(70% 90% at 12% 40%,rgba(208,59,59,.14),transparent 70%),var(--panel)}
.xp.cc{display:flex}
.cc-f{flex:none;width:45%;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#25252e,#101014);position:relative}
.cc-f img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.cc:hover .cc-f img{transform:scale(1.03)}
.cc-f .nb{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 12px;background:linear-gradient(transparent,rgba(8,8,10,.92))}
.cc-f .nb h3{font:700 32px/1 var(--B);text-transform:uppercase;white-space:nowrap}
.cc-f .nb span{font:600 13px var(--B);color:var(--gold)}
.cc-d{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;position:relative}
.cc-ig{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cc-ig>div{background:var(--deep);border:1px solid var(--line);border-radius:9px;padding:6px 9px;display:flex;align-items:center;gap:7px;min-height:44px}
.cc-ig img,.cc-ig svg.fl{width:24px;height:24px;object-fit:contain;flex:none}
.cc-ig svg.fl{height:17px}
.cc-ig b{display:block;font:700 13px/1.15 var(--B)}
.cc-ig small{display:block;font:600 9.5px/1.2 var(--B);color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
.cc-kp{display:flex;flex-direction:column;gap:0;flex:1;min-height:0}
.cc-kp>div{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:center;border-top:1px solid var(--line2);flex:1}
.cc-kp b{font:700 41px/1 var(--B);color:var(--gold);font-variant-numeric:tabular-nums}
.cc-kp span{font:500 14px/1.32 var(--B);color:var(--soft)}
.cc-mini{height:158px;flex:none;display:grid;grid-template-columns:228px 1fr;gap:12px;align-items:center;border-top:1px solid var(--line2);padding-top:9px}
.cc-mini .tx{font-size:13.5px;line-height:1.38}
.cc-x{display:grid;grid-template-columns:38% 1fr;gap:22px;height:100%;min-height:0}
.cc-x .ph{min-height:0}
.cc-x .ph{border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#25252e,#101014)}
.cc-x .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
.cc-x h3{font:700 36px/1 var(--B);text-transform:uppercase;margin-bottom:6px}
.cc-x ul{list-style:none;margin:10px 0}
.cc-x li{position:relative;padding:9px 0 9px 18px;border-top:1px solid var(--line2);font:500 15px/1.4 var(--B);color:var(--soft)}
.cc-x li b{color:var(--text)}
.cc-x li::before{content:"";position:absolute;left:0;top:17px;width:10px;height:2px;background:var(--gold)}
.lk{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lk button{background:var(--red);border:0;color:#fff;font:700 12px var(--B);padding:8px 13px;border-radius:8px;letter-spacing:.03em}
.lk button.s{background:var(--panel2);border:1px solid var(--line)}
.cp-pl{flex:none;display:flex;align-items:center;gap:12px;padding:7px 12px;background:var(--deep);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.cp-pl:hover{border-color:#4a4a58}
.cp-pl img{height:42px;width:42px;border-radius:50%;object-fit:cover;object-position:50% 10%;background:#23232b}
.cp-pl b{font:700 15px var(--B)}
.cp-pl span{font:500 13px/1.3 var(--B);color:var(--soft)}
.cp-pl em{margin-left:auto;font:500 11.5px var(--B);color:var(--muted);font-style:normal}

/* clube */
.fx{flex:none;display:flex;gap:18px;align-items:center;padding:0 2px}
.fx>div{display:flex;align-items:baseline;gap:6px}
.fx b{font:700 21px var(--B);font-variant-numeric:tabular-nums}
.fx span{font:600 11px var(--B);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.vf{flex:1;min-height:0;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:1fr 1fr;gap:11px}
.vc{--acc:var(--gold)}
.vc.fr{--acc:#8E8E9A}
.vc .tp{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.vc .ro{font:700 10.5px var(--B);letter-spacing:.13em;text-transform:uppercase;color:var(--gold)}
.vc.fr .ro{color:#A9A9B5}
.vc .nb{font:700 50px/1 var(--B);color:var(--gold);margin-top:3px}
.vc.fr .nb{color:var(--text)}
.vc .nb small{font:700 15px var(--B);color:var(--muted);margin-left:5px}
.vc h4{font:700 15.5px/1.2 var(--B);margin-top:5px}
.vc p{font:500 12.5px/1.35 var(--B);color:var(--soft);margin-top:3px}
.vc .sp{flex:1;min-height:0;margin-top:7px;display:flex;align-items:flex-end;gap:3px}
.vc .sp i{flex:1;background:#34343f;border-radius:2px 2px 0 0;display:block}
.vc .sp i.m{background:var(--gold)}
.vc.fr .sp i.m{background:#EDEDF0}
.vx{display:grid;grid-template-columns:360px 1fr;gap:24px;height:100%}
.vx .nb{font-size:72px}
.vx .tx{margin-top:8px;font-size:14.5px}
.rk20{display:grid;grid-auto-flow:column;grid-template-rows:repeat(10,1fr);grid-template-columns:1fr 1fr;gap:3px 22px;height:100%}
.rk{display:grid;grid-template-columns:22px 142px 1fr 44px;gap:7px;align-items:center;font:500 12px var(--B);color:var(--soft)}
.rk i{font-style:normal;color:var(--muted);font-weight:700}
.rk u{display:block;height:9px;background:#34343f;border-radius:0 3px 3px 0;text-decoration:none}
.rk b{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.rk.m{color:#fff;font-weight:700}
.rk.m u{background:var(--gold)}
.rk.m b{color:var(--gold)}
.rk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* carências */
.lc{flex:1;min-height:0;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.lc-c{padding:0;--acc:var(--gold)}
.lc-f{height:216px;flex:none;position:relative;background:radial-gradient(70% 90% at 50% 30%,rgba(208,59,59,.2),transparent 70%),#17171d;overflow:hidden}
.lc-f img{width:100%;height:100%;object-fit:cover;object-position:50% 10%;display:block}
.lc-f .lb{position:absolute;left:0;right:0;bottom:0;padding:30px 13px 9px;background:linear-gradient(transparent,rgba(8,8,10,.95));display:flex;justify-content:space-between;align-items:flex-end}
.lc-f .lb b{font:700 19px var(--B);text-transform:uppercase}
.lc-f .lb span{font:700 10px var(--B);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.lc-b{padding:11px 13px 26px;display:flex;flex-direction:column;gap:7px;flex:1;min-height:0}
.lc-b h4{font:700 16.5px/1.2 var(--B)}
.lc-b p{font:500 12.5px/1.38 var(--B);color:var(--soft)}
.lc-v{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:7px}
.lc-g{font:700 44px/1 var(--B);color:var(--gold);font-variant-numeric:tabular-nums}
.lc-g small{font:600 12.5px/1.25 var(--B);color:var(--soft);display:block;margin-top:3px}
.lc-b .rsp{border-top:1px solid var(--line);padding-top:7px;font:600 13px/1.35 var(--B);color:var(--text)}
.lc-b .rsp b{display:block;font:700 10px var(--B);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.lnr{position:relative;height:30px}
.lnr .ax{position:absolute;left:0;right:0;top:14px;height:2px;background:#2c2c35}
.lnr .pt{position:absolute;top:6px;width:18px;height:18px;margin-left:-9px;border-radius:50%;display:grid;place-items:center;font:700 9.5px var(--B);background:#34343f;color:#fff}
.lnr .pt.g{background:var(--gold);color:#08080a}
.lnr-r{display:grid;grid-template-columns:88px 1fr;gap:7px;align-items:center;font:600 11px var(--B);color:var(--soft)}
.balls{display:flex;gap:4px;flex-wrap:wrap}
.balls i{width:22px;height:22px;border-radius:50%;background:#2c2c35;display:block}
.balls i.g{background:var(--gold)}
.mb{display:grid;grid-template-columns:96px 1fr 38px;gap:6px;align-items:center;font:600 12px var(--B);color:var(--soft);padding:2px 0}
.mb u{display:block;height:9px;background:#3b3b46;border-radius:0 3px 3px 0;text-decoration:none}
.mb.g u{background:var(--gold)}
.mb b{text-align:right;font-variant-numeric:tabular-nums}
.tri{display:grid;grid-template-columns:1fr auto;font:600 12px/1.65 var(--B);color:var(--soft);border-bottom:1px solid var(--line2)}
.tri b{color:var(--muted);font-weight:600}
.lc-x{display:grid;grid-template-columns:330px 1fr;gap:22px;height:100%;margin:-11px -13px -26px;padding:0}
.lc-x .im{background:radial-gradient(70% 90% at 50% 30%,rgba(208,59,59,.2),transparent 70%),#17171d;height:100%;overflow:hidden}
.lc-x .im img{width:100%;height:100%;object-fit:cover;object-position:50% 10%}
.lc-x .tt{padding:22px 40px 16px 0;overflow:hidden}
.lc-x h3{font:700 30px/1.1 var(--B);margin-bottom:10px}
.lc-x .rs{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.lc-x .nbb{display:flex;gap:26px;margin-top:10px}
.lc-x .nbb b{display:block;font:700 44px/1 var(--B);color:var(--gold)}
.lc-x .nbb span{font:500 12.5px/1.3 var(--B);color:var(--soft);display:block;max-width:200px;margin-top:4px}

/* treinador */
.tr-g{flex:1;min-height:0;display:grid;gap:11px;grid-template-columns:300px minmax(0,1fr) 350px;grid-template-rows:minmax(0,1fr) 108px}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;position:relative}
.pn.dp{background:var(--deep)}
.pn-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex:none;min-height:24px}
.tr-p{grid-row:1/3;padding:0;overflow:hidden}
.tr-p .im{height:400px;flex:none;position:relative;overflow:hidden}
.tr-p .im img{width:100%;height:100%;object-fit:cover;object-position:62% 20%;display:block}
.tr-p .im .nb{position:absolute;left:0;right:0;bottom:0;padding:50px 14px 10px;background:linear-gradient(transparent,rgba(8,8,10,.94))}
.tr-p .im h3{font:700 27px/1 var(--B);text-transform:uppercase}
.tr-p .im span{font:600 12px var(--B);color:var(--gold)}
.tr-p .ct{padding:11px 14px;display:flex;flex-direction:column;gap:7px;flex:1;min-height:0}
.qt{font:600 16px/1.3 var(--B);color:var(--text);border-left:3px solid var(--gold);padding-left:11px}
.qt small{display:block;font:500 11px/1.35 var(--B);color:var(--muted);margin-top:4px}
.tl-i{display:grid;grid-template-columns:62px 1fr;gap:9px;font:500 12px/1.3 var(--B);color:var(--soft);padding:3px 0;border-top:1px solid var(--line2)}
.tl-i b{color:var(--text)}
.wdl{display:flex;height:14px;border-radius:3px;overflow:hidden;gap:1px}
.wdl i{display:block;background:#3b3b46}
.wdl i.w{background:var(--gold)}
.wdl i.d{background:#7B7B88}
.wdl i.l{background:#3b3b46}
.hs{display:grid;grid-template-columns:118px 34px 1fr 62px;gap:8px;align-items:center;font:600 12px var(--B);color:var(--soft);padding:4px 0;border-bottom:1px solid var(--line2)}
.hs small{display:block;font:500 10.5px var(--B);color:var(--muted)}
.hs.m b.n{color:#fff}
.hs em{font-style:normal;font:700 11.5px var(--B);text-align:right;font-variant-numeric:tabular-nums}
.leg{display:flex;gap:10px;font:600 10.5px var(--B);color:var(--muted);align-items:center}
.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.vn{display:grid;grid-template-columns:130px 1fr 40px;gap:8px;align-items:center;font:600 12px var(--B);color:var(--soft);padding:3px 0}
.vn .br{position:relative;height:13px;background:var(--deep);border:1px solid var(--line);border-radius:3px}
.vn .br s{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#4a4a58}
.vn .br b{position:absolute;top:2px;bottom:2px;background:var(--gold);border-radius:2px}
.vn .br b.neg{background:#7B7B88}
.vn em{font-style:normal;text-align:right;font:700 12px var(--B);font-variant-numeric:tabular-nums}
.str{display:flex;gap:4px;flex:1;min-height:0}
.gm{flex:1;min-width:0;border-radius:6px;background:var(--panel2);border:1px solid var(--line);padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 10px/1.05 var(--B);color:var(--soft);cursor:default;text-align:center}
.gm u{text-decoration:none;display:block;width:12px;height:12px;border-radius:50%}
.gm u.w{background:var(--gold)}
.gm u.d{background:#7B7B88}
.gm u.l{background:#101014;border:1.5px solid #6E6E7C}
.gm.nd{color:#6c6c78}
.gm.lig{border-color:#4a4a58;background:#20202a;color:#fff}
.gm:hover{border-color:var(--gold)}
.gm small{font:600 8.5px var(--B);color:var(--muted)}

/* perfil */
.pf{flex:1;min-height:0;display:grid;gap:11px;grid-template-columns:272px minmax(0,1fr) 300px;grid-template-rows:64px 112px 184px minmax(0,1fr);grid-template-areas:"id cab attr" "id sin attr" "id fts attr" "id trj attr"}
.pf-id{grid-area:id;padding:10px}
.pf-id .ph{flex:none;height:326px;border-radius:12px;overflow:hidden;position:relative;background:radial-gradient(70% 80% at 50% 30%,rgba(208,59,59,.26),transparent 70%),#17171d}
.pf-id .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.dl>div{background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-width:0}
.dl small{display:block;font:600 9.5px/1.2 var(--B);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.dl b{display:flex;align-items:center;gap:5px;font:700 12.5px/1.25 var(--B)}
.dl b img,.dl b svg{height:16px;width:18px;object-fit:contain;flex:none}
.dl>div:first-child,.dl>div:last-child{grid-column:1/3}
.pf-mc{flex:1;min-height:0;position:relative}
.pf-cab{grid-area:cab;display:flex;align-items:center;gap:16px;min-width:0}
.pf-cab .nm{flex:1;min-width:0}
.pf-cab h2{font:700 41px/1 var(--B);text-transform:uppercase;white-space:nowrap;overflow:hidden}
.pf-cab p{font:500 13.5px/1.25 var(--B);color:var(--soft);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovn{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:132px;height:62px;border-radius:12px;background:var(--deep);border:2px solid var(--gold)}
.ovn b{font:700 27px/1 var(--B);color:var(--gold)}
.ovn small{color:var(--muted);font:700 9px/1.1 var(--B);letter-spacing:.1em;margin-top:2px;text-transform:uppercase;text-align:center}
.pf-tb{display:flex;gap:6px;flex:none}
.pf-sin{grid-area:sin;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;min-width:0}
.sg{background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:8px 11px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.sg small{font:700 10px/1.15 var(--B);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.sg .kn{font:700 22px/1.1 var(--B);margin-top:2px;font-variant-numeric:tabular-nums}
.sg .kc{font:500 11.5px/1.25 var(--B);color:var(--soft)}
.sg svg{display:block;width:100%;flex:1;min-height:0;margin-top:4px}
.sgb{display:flex;gap:2px;flex:1;min-height:0;margin-top:4px;border-radius:4px;overflow:hidden}
.sgb div{display:flex;align-items:center;justify-content:center;font:700 10.5px var(--B);background:#3b3b46;color:#EDEDF0;min-height:14px}
.sgb div.g{background:var(--gold);color:#08080a}
.pf-fts{display:grid;grid-area:fts;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ft1{--acc:var(--gold);background:var(--deep);padding:11px 13px;border-top:3px solid var(--gold)}
.ft1 .nb{font:700 40px/1 var(--B);color:var(--gold);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.ft1 .nb small{font:700 12.5px var(--B);color:var(--muted)}
.ft1 .fr1{font:600 14px/1.27 var(--B);margin-top:5px}
.ft1 .pe{color:var(--muted);font:500 11.5px/1.3 var(--B);margin-top:4px}
.ft-x{display:grid;grid-template-columns:400px minmax(0,560px);gap:40px;height:100%;padding:18px;align-content:start}
.ft-x .fr1{margin-top:12px}
.ft-x .nb{font-size:80px}
.pf-trj{grid-area:trj;gap:6px}
.pf-at{grid-area:attr;overflow:hidden;gap:3px;padding:10px 12px}
.tjb{display:flex;gap:6px;align-items:flex-end;min-width:0;flex:1;min-height:0}
.tjb-c{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-radius:8px;padding:2px 0}
.tjb-c:hover{background:#1c1c24}
.tjb-c.on{background:#20202a}
.tjb-c b{font:700 11px var(--B);color:var(--soft);font-variant-numeric:tabular-nums}
.tjb-p{display:flex;align-items:flex-end;width:100%;justify-content:center}
.tjb-b{width:min(100%,42px);display:flex;flex-direction:column;gap:2px}
.tjb-b i{display:block;min-height:2px;background:#6E6E7C}
.tjb-b i:first-child{border-radius:4px 4px 0 0}

.sc.on .sc-p{animation:scPop .5s cubic-bezier(.2,1.4,.4,1) var(--d,0ms) forwards;transform-box:fill-box;transform-origin:center}
.sc.on .sc-r{animation:scFade .35s ease var(--d,0ms) forwards}

@keyframes scPop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){.sc-p,.sc-r{opacity:1}.sc.on .sc-p,.sc.on .sc-r,.sc.on .sc-guia{animation:none}.sc-guia{stroke-dashoffset:0}}

 32 in accurate long passes per 90 minutes (3.48) and 2nd in accuracy (67.4%): he takes risks and delivers."},"jg_fe_p2":{"pt":"O Real Murcia tem a bola em 54% do tempo, mas é o 17.º do grupo em passes longos certos. Felipe joga de 1.º ou 2.º volante, recupera a bola sem arriscar falta (4.º que menos comete entre 32 volantes) e traz a saída de bola que hoje está em poucos pés.","br":"O Real Murcia tem a bola em 54% do tempo, mas é o 17º do grupo em passes longos certos. Felipe joga de 1º ou 2º volante, recupera a bola sem arriscar falta (4º que menos comete entre 32 volantes) e traz a saída de bola que hoje está em poucos pés.","es":"El Real Murcia tiene el balón el 54% del tiempo, pero es el 17.º del grupo en pases largos acertados. Felipe juega de primer o segundo pivote, recupera el balón sin arriesgar falta (4.º que menos comete entre 32 pivotes) y aporta la salida de balón que hoy está en pocos pies.","en":"Real Murcia have the ball 54% of the time but are 17th in the group in accurate long passes. Felipe plays as first or second pivot, wins the ball without risking fouls (4th fewest among 32 holding midfielders) and brings the build-up that today sits in few feet."},"jg_gi_p1":{"pt":"Meia-atacante de 24 anos, brasileiro com cidadania italiana, formado entre Santos e Ajax. Vice-líder de assistências da Superliga do Kosovo 2025/26 (7) e 6.º em participações em golo (15) entre os 100 jogadores com mais minutos.","br":"Meia-atacante de 24 anos, brasileiro com cidadania italiana, formado entre Santos e Ajax. Vice-líder de assistências da Superliga do Kosovo 2025/26 (7) e 6º em participações em gol (15) entre os 100 jogadores com mais minutos.","es":"Mediapunta de 24 años, brasileño con ciudadanía italiana, formado entre Santos y Ajax. Subcampeón de asistencias de la Superliga de Kosovo 2025/26 (7) y 6.º en participaciones de gol (15) entre los 100 jugadores con más minutos.","en":"A 24-year-old attacking midfielder, Brazilian with Italian citizenship, trained between Santos and Ajax. Runner-up for assists in the 2025/26 Kosovo Superliga (7) and 6th in goal involvements (15) among the 100 players with most minutes."},"jg_gi_p2":{"pt":"Marca com os dois pés (6 golos de direito, 3 de esquerdo e 2 de cabeça) e começou 2026/27 em alta: 2 golos e 1 assistência na Conference League e mais um golo em 30/10, no 4-0 sobre o Drenica.","br":"Marca com os dois pés (6 gols de direita, 3 de esquerda e 2 de cabeça) e começou 2026/27 em alta: 2 gols e 1 assistência na Conference League e mais um gol em 30/10, no 4-0 sobre o Drenica.","es":"Marca con los dos pies (6 goles con la derecha, 3 con la izquierda y 2 de cabeza) y empezó 2026/27 en alza: 2 goles y 1 asistencia en la Conference League y otro gol el 30/10, en el 4-0 al Drenica.","en":"He scores with both feet (6 right-footed, 3 left-footed and 2 headers) and started 2026/27 in form: 2 goals and 1 assist in the Conference League and another goal on 30/10, in the 4-0 win over Drenica."},"cl_emp_b":{"pt":"empate com mais {n}","br":"empate com mais {n}","es":"empate con {n} más","en":"level with {n} more"},"cv_gols_sofridos_u":{"pt":"golos sofridos por jogo","br":"gols sofridos por jogo","es":"goles encajados por partido","en":"goals conceded per game"},"cv_gols_sofridos_s":{"pt":"8 golos em 10 jogos, só 1 em casa. Dani Jiménez jogou os 900 minutos e Cristo foi titular nos 10 jogos: há uma base estável atrás.","br":"8 gols em 10 jogos, só 1 em casa. Dani Jiménez jogou os 900 minutos e Cristo foi titular nos 10 jogos: há uma base estável atrás.","es":"8 goles en 10 partidos, solo 1 en casa. Dani Jiménez jugó los 900 minutos y Cristo fue titular en los 10 partidos: hay una base estable atrás.","en":"8 goals in 10 games, only 1 at home. Dani Jiménez played all 900 minutes and Cristo started all 10: there is a stable base at the back."},"cx_gols_sofridos":{"pt":"Quem menos sofre no grupo: 8 golos em 10 jornadas, só 1 nos 4 jogos em casa e 7 nos 6 fora. A base é estável: Dani Jiménez nos 900 minutos, Cristo titular em todos os jogos, Jorge Mier em 9 e Héctor Pérez em 8. Ainda assim, recebe 14,7 remates por jogo (14.º): a defesa e o guarda-redes seguram o que o rival cria. Quanto mais tempo a bola ficar em bons pés no meio-campo, menos remates chegam.","br":"Quem menos sofre no grupo: 8 gols em 10 rodadas, só 1 nos 4 jogos em casa e 7 nos 6 fora. A base é estável: Dani Jiménez nos 900 minutos, Cristo titular em todos os jogos, Jorge Mier em 9 e Héctor Pérez em 8. Ainda assim, recebe 14,7 finalizações por jogo (14º): a defesa e o goleiro seguram o que o rival cria. Quanto mais tempo a bola ficar em bons pés no meio-campo, menos finalizações chegam.","es":"Quien menos encaja del grupo: 8 goles en 10 jornadas, solo 1 en los 4 partidos en casa y 7 en los 6 de fuera. La base es estable: Dani Jiménez los 900 minutos, Cristo titular en todos los partidos, Jorge Mier en 9 y Héctor Pérez en 8. Aun así, recibe 14,7 remates por partido (14.º): la defensa y el portero aguantan lo que crea el rival. Cuanto más tiempo esté el balón en buenos pies en el centro del campo, menos remates llegan.","en":"The fewest conceded in the group: 8 goals in 10 rounds, only 1 in 4 home games and 7 in 6 away. The base is stable: Dani Jiménez for 900 minutes, Cristo starting every game, Jorge Mier in 9 and Héctor Pérez in 8. Even so, they face 14.7 shots per game (14th): the defence and goalkeeper hold what the opponent creates. The longer the ball stays in good feet in midfield, the fewer shots arrive."},"cv_jogos_sem_sofrer_u":{"pt":"jogos sem sofrer, em 10","br":"jogos sem sofrer, em 10","es":"partidos sin encajar, de 10","en":"clean sheets in 10 games"},"cv_jogos_sem_sofrer_s":{"pt":"Metade dos jogos acaba sem sofrer golos, empatado em 1.º com mais duas equipas. É o que sustenta o 4.º lugar, a dois pontos do topo.","br":"Metade dos jogos acaba sem sofrer gols, empatado em 1º com mais dois times. É o que sustenta o 4º lugar, a dois pontos do topo.","es":"La mitad de los partidos acaba sin encajar goles, empatado en el 1.º puesto con otros dos equipos. Es lo que sostiene el 4.º puesto, a dos puntos de la cima.","en":"Half of the games end without conceding, level in 1st with two other teams. It is what holds up 4th place, two points off the top."},"cx_jogos_sem_sofrer":{"pt":"Cinco jogos sem sofrer em dez, empatado em 1.º com mais duas equipas. A margem é curta: nos 4 jogos em que não marcou, o Real Murcia fez 1 empate (0-0 com o Zaragoza) e sofreu 3 derrotas. Defender bem sustenta o 4.º lugar, mas sem golos não chega para subir.","br":"Cinco jogos sem sofrer em dez, empatado em 1º com mais dois times. A margem é curta: nos 4 jogos em que não marcou, o Real Murcia fez 1 empate (0-0 com o Zaragoza) e sofreu 3 derrotas. Defender bem sustenta o 4º lugar, mas sem gols não chega para subir.","es":"Cinco partidos sin encajar de diez, empatado en el 1.º puesto con otros dos equipos. El margen es corto: en los 4 partidos en que no marcó, el Real Murcia sumó 1 empate (0-0 con el Zaragoza) y 3 derrotas. Defender bien sostiene el 4.º puesto, pero sin goles no alcanza para subir.","en":"Five clean sheets in ten, level in 1st with two other teams. The margin is thin: in the 4 games where they did not score, Real Murcia drew once (0-0 with Zaragoza) and lost 3. Defending well holds up 4th place, but without goals it is not enough to go up."},"cv_posse_u":{"pt":"de posse de bola","br":"de posse de bola","es":"de posesión","en":"possession"},"cv_posse_s":{"pt":"O plano é ter a bola e a equipa tem-na, mas só é a 8.ª em passes por jogo. Posse sozinha não chega: o treinador quer-na «para fazer dano».","br":"O plano é ter a bola e o time tem-na, mas só é a 8ª em passes por jogo. Posse sozinha não chega: o técnico quer-na «para fazer dano».","es":"El plan es tener el balón y el equipo lo tiene, pero solo es el 8.º en pases por partido. La posesión sola no basta: el entrenador la quiere «para hacer daño».","en":"The plan is to have the ball and the team has it, but they are only 8th in passes per game. Possession alone is not enough: the coach wants it “to do damage”."},"cx_posse":{"pt":"54,1% de posse (4.º) e 8.º em passes por jogo. Depois do 1-0 em Antequera, o treinador disse: «No queremos tener la posesión por tenerla, sino para hacer daño». A distância entre posse (4.º) e criação (11.º em passes-chave, 13.º em remates) é a razão deste documento: a bola está lá, falta quem a transforme em ocasião.","br":"54,1% de posse (4º) e 8º em passes por jogo. Depois do 1-0 em Antequera, o técnico disse: «No queremos tener la posesión por tenerla, sino para hacer daño». A distância entre posse (4º) e criação (11º em passes-chave, 13º em finalizações) é a razão deste documento: a bola está lá, falta quem a transforme em ocasião.","es":"54,1% de posesión (4.º) y 8.º en pases por partido. Tras el 1-0 en Antequera, el entrenador dijo: «No queremos tener la posesión por tenerla, sino para hacer daño». La distancia entre posesión (4.º) y creación (11.º en pases clave, 13.º en remates) es la razón de este documento: el balón está ahí, falta quien lo convierta en ocasión.","en":"54.1% possession (4th) and 8th in passes per game. After the 1-0 at Antequera, the coach said: “No queremos tener la posesión por tenerla, sino para hacer daño”. The gap between possession (4th) and creation (11th in key passes, 13th in shots) is the reason for this document: the ball is there, someone is needed to turn it into chances."},"cv_ppda_u":{"pt":"passes do rival por ação defensiva","br":"passes do rival por ação defensiva","es":"pases del rival por acción defensiva","en":"opposition passes per defensive action"},"cv_ppda_s":{"pt":"Quanto menor, mais incomoda a saída do rival: 9,9, 5.º do grupo. A equipa recupera cedo e precisa de um meio-campo que saia limpo quando recupera.","br":"Quanto menor, mais incomoda a saída do rival: 9,9, 5º do grupo. O time recupera cedo e precisa de um meio-campo que saia limpo quando recupera.","es":"Cuanto menor, más molesta la salida del rival: 9,9, 5.º del grupo. El equipo recupera pronto y necesita un centro del campo que salga limpio al recuperar.","en":"The lower, the more it disturbs the opponent's build-up: 9.9, 5th in the group. The team wins the ball early and needs a midfield that comes out clean after winning it."},"cx_ppda":{"pt":"PPDA de 9,9 (menos é melhor; mediana do grupo 12,2). A equipa pressiona e recupera alto, e isso exige que o meio-campo aguente a pressão e saia bem da recuperação. Os quatro médios mais usados somam 2.279 minutos; Palmberg tem 88,9% de acerto de passe (13.º entre 90 médios do grupo) e poucas perdas (7,4 por 90, 11.º).","br":"PPDA de 9,9 (menos é melhor; mediana do grupo 12,2). O time pressiona e recupera alto, e isso exige que o meio-campo aguente a pressão e saia bem da recuperação. Os quatro meio-campistas mais usados somam 2.279 minutos; Palmberg tem 88,9% de acerto de passe (13º entre 90 meio-campistas do grupo) e poucas perdas (7,4 por 90, 11º).","es":"PPDA de 9,9 (menos es mejor; mediana del grupo 12,2). El equipo presiona y recupera arriba, y eso exige que el centro del campo aguante la presión y salga bien de la recuperación. Los cuatro centrocampistas más usados suman 2.279 minutos; Palmberg tiene un 88,9% de acierto de pase (13.º entre 90 centrocampistas del grupo) y pocas pérdidas (7,4 por 90, 11.º).","en":"PPDA of 9.9 (lower is better; group median 12.2). The team presses and wins the ball high, which demands a midfield that can withstand the press and come out well after recovering. The four most-used midfielders total 2,279 minutes; Palmberg has 88.9% pass accuracy (13th among 90 midfielders in the group) and few losses (7.4 per 90, 11th)."},"cv_gols_u":{"pt":"golos por jogo","br":"gols por jogo","es":"goles por partido","en":"goals per game"},"cv_gols_s":{"pt":"12 golos em 10 jogos e 4 jogos sem marcar. Em casa marca 2 por jogo; fora, só 0,7.","br":"12 gols em 10 jogos e 4 jogos sem marcar. Em casa marca 2 por jogo; fora, só 0,7.","es":"12 goles en 10 partidos y 4 partidos sin marcar. En casa marca 2 por partido; fuera, solo 0,7.","en":"12 goals in 10 games and 4 games without scoring. At home they score 2 per game; away, only 0.7."},"cx_gols":{"pt":"12 golos em 10 jogos, 13.º do grupo, com 8 em casa e 4 fora. Quem decide joga pelos lados: Jorquera e Javi Moreno somam 4 golos e 5 assistências e o melhor marcador, Flakus Bosilj, tem 3. Dos 12 golos, 2 vieram dos quatro médios mais usados (Javi Mier e Óscar Gil), sem nenhuma assistência.","br":"12 gols em 10 jogos, 13º do grupo, com 8 em casa e 4 fora. Quem decide joga pelos lados: Jorquera e Javi Moreno somam 4 gols e 5 assistências e o artilheiro, Flakus Bosilj, tem 3. Dos 12 gols, 2 vieram dos quatro meio-campistas mais usados (Javi Mier e Óscar Gil), sem nenhuma assistência.","es":"12 goles en 10 partidos, 13.º del grupo, con 8 en casa y 4 fuera. Quien decide juega por los lados: Jorquera y Javi Moreno suman 4 goles y 5 asistencias y el máximo goleador, Flakus Bosilj, tiene 3. De los 12 goles, 2 llegaron de los cuatro centrocampistas más usados (Javi Mier y Óscar Gil), sin ninguna asistencia.","en":"12 goals in 10 games, 13th in the group, 8 at home and 4 away. The deciders play wide: Jorquera and Javi Moreno add up to 4 goals and 5 assists and the top scorer, Flakus Bosilj, has 3. Of the 12 goals, 2 came from the four most-used midfielders (Javi Mier and Óscar Gil), with no assists."},"cv_finalizacoes_u":{"pt":"remates por jogo","br":"finalizações por jogo","es":"remates por partido","en":"shots per game"},"cv_finalizacoes_s":{"pt":"Com 54% de posse, remata menos do que a mediana do grupo (9,6). Os médios quase não rematam: Javi Mier faz 0,64 por 90 e Chema Núñez nenhum.","br":"Com 54% de posse, finaliza menos do que a mediana do grupo (9,6). Os meio-campistas quase não finalizam: Javi Mier faz 0,64 por 90 e Chema Núñez nenhuma.","es":"Con un 54% de posesión, remata menos que la mediana del grupo (9,6). Los centrocampistas casi no rematan: Javi Mier hace 0,64 por 90 y Chema Núñez ninguno.","en":"With 54% possession, they shoot less than the group median (9.6). The midfielders hardly shoot: Javi Mier takes 0.64 per 90 and Chema Núñez none."},"cx_finalizacoes":{"pt":"9,1 remates por jogo (13.º), abaixo da mediana (9,6), apesar de a posse ser a 4.ª do grupo. A chegada à área a partir do meio-campo é pouca: Javi Mier faz 0,64 remates por 90 e Chema Núñez nenhum. É o recurso que Giovanni acrescenta (2,45 remates por 90 na liga do Kosovo), ainda que as ligas sejam diferentes.","br":"9,1 finalizações por jogo (13º), abaixo da mediana (9,6), apesar de a posse ser a 4ª do grupo. A chegada à área a partir do meio-campo é pouca: Javi Mier faz 0,64 finalização por 90 e Chema Núñez nenhuma. É o recurso que Giovanni acrescenta (2,45 finalizações por 90 na liga do Kosovo), ainda que as ligas sejam diferentes.","es":"9,1 remates por partido (13.º), por debajo de la mediana (9,6), pese a que la posesión es la 4.ª del grupo. La llegada al área desde el centro del campo es escasa: Javi Mier hace 0,64 remates por 90 y Chema Núñez ninguno. Es el recurso que añade Giovanni (2,45 remates por 90 en la liga de Kosovo), aunque las ligas sean distintas.","en":"9.1 shots per game (13th), below the median (9.6), even though possession is 4th in the group. Arrivals in the box from midfield are scarce: Javi Mier takes 0.64 shots per 90 and Chema Núñez none. It is the resource Giovanni adds (2.45 shots per 90 in the Kosovo league), though the leagues differ."},"cv_passes_chave_u":{"pt":"passes-chave por jogo","br":"passes-chave por jogo","es":"pases clave por partido","en":"key passes per game"},"cv_passes_chave_s":{"pt":"Passes que acabam em remate: 9,1 por jogo, perto da mediana (9,25). Chema Núñez dá 1,7 por 90, mas em 469 minutos; Javi Mier, 0,8.","br":"Passes que acabam em finalização: 9,1 por jogo, perto da mediana (9,25). Chema Núñez dá 1,7 por 90, mas em 469 minutos; Javi Mier, 0,8.","es":"Pases que acaban en remate: 9,1 por partido, cerca de la mediana (9,25). Chema Núñez da 1,7 por 90, pero en 469 minutos; Javi Mier, 0,8.","en":"Passes that end in a shot: 9.1 per game, close to the median (9.25). Chema Núñez gives 1.7 per 90, but in 469 minutes; Javi Mier, 0.8."},"cx_passes_chave":{"pt":"11.º do grupo, com 9,1 passes-chave por jogo (empatado com mais uma equipa). A criação depende de poucos jogadores e do jogo pelos lados. Chema Núñez joga entre linhas, como pediu o treinador, e dá 1,7 por 90, mas só somou 469 minutos; Javi Mier, o médio mais usado, dá 0,8 por 90.","br":"11º do grupo, com 9,1 passes-chave por jogo (empatado com mais um time). A criação depende de poucos jogadores e do jogo pelos lados. Chema Núñez joga entre linhas, como pediu o técnico, e dá 1,7 por 90, mas só somou 469 minutos; Javi Mier, o meio-campista mais usado, dá 0,8 por 90.","es":"11.º del grupo, con 9,1 pases clave por partido (empatado con otro equipo). La creación depende de pocos jugadores y del juego por los lados. Chema Núñez juega entre líneas, como pidió el entrenador, y da 1,7 por 90, pero solo sumó 469 minutos; Javi Mier, el centrocampista más usado, da 0,8 por 90.","en":"11th in the group, with 9.1 key passes per game (level with one other team). Creation depends on few players and on wide play. Chema Núñez plays between the lines, as the coach asked, and gives 1.7 per 90, but has only 469 minutes; Javi Mier, the most-used midfielder, gives 0.8 per 90."},"cv_passes_longos_certos_u":{"pt":"passes longos certos por jogo","br":"passes longos certos por jogo","es":"pases largos acertados por partido","en":"accurate long passes per game"},"cv_passes_longos_certos_s":{"pt":"Tenta 53,3 por jogo e acerta 45%: é menos volume, não mais erro. O guarda-redes faz um quarto das tentativas.","br":"Tenta 53,3 por jogo e acerta 45%: é menos volume, não mais erro. O goleiro faz um quarto das tentativas.","es":"Intenta 53,3 por partido y acierta el 45%: es menos volumen, no más error. El portero hace una cuarta parte de los intentos.","en":"They try 53.3 per game and complete 45%: less volume, not more errors. The goalkeeper makes a quarter of the attempts."},"cx_passes_longos_certos":{"pt":"24,0 passes longos certos por jogo, 17.º do grupo: tenta 53,3 (15.º) e acerta 45% (12.º; mediana 45,7%). O guarda-redes faz um quarto das tentativas e, entre os de linha, só Alberto González (61%) e Chema Núñez (56%) tentam mais de 6 por 90; Javi Mier tenta 3,1, com 38%. Falta um médio que lance com precisão: é o que o Felipe faz (5,16 tentados por 90, 67,4% de acerto na Série B 2026).","br":"24,0 passes longos certos por jogo, 17º do grupo: tenta 53,3 (15º) e acerta 45% (12º; mediana 45,7%). O goleiro faz um quarto das tentativas e, entre os de linha, só Alberto González (61%) e Chema Núñez (56%) tentam mais de 6 por 90; Javi Mier tenta 3,1, com 38%. Falta um meio-campista que lance com precisão: é o que o Felipe faz (5,16 tentados por 90, 67,4% de acerto na Série B 2026).","es":"24,0 pases largos acertados por partido, 17.º del grupo: intenta 53,3 (15.º) y acierta el 45% (12.º; mediana 45,7%). El portero hace una cuarta parte de los intentos y, entre los de campo, solo Alberto González (61%) y Chema Núñez (56%) intentan más de 6 por 90; Javi Mier intenta 3,1, con un 38%. Falta un centrocampista que lance con precisión: es lo que hace Felipe (5,16 intentados por 90, 67,4% de acierto en la Série B 2026).","en":"24.0 accurate long passes per game, 17th in the group: they try 53.3 (15th) and complete 45% (12th; median 45.7%). The goalkeeper makes a quarter of the attempts and, among outfield players, only Alberto González (61%) and Chema Núñez (56%) try more than 6 per 90; Javi Mier tries 3.1, at 38%. A midfielder who plays the long ball accurately is missing: that is what Felipe does (5.16 attempted per 90, 67.4% accuracy in the 2026 Série B)."},"tc_xi":{"pt":"Onze mais utilizado","br":"Onze mais utilizado","es":"Once más utilizado","en":"Most-used line-up"},"tc_dep":{"pt":"Profundidade","br":"P  Errahaly and Meca."},"u_tj":{"pt":"jogos","br":"jogos","es":"partidos","en":"games"},"st_k":{"pt":"A história","br":"A história","es":"La historia","en":"The story"},"fe_st1":{"pt":"Estreou na Ponte Preta B em 2020 e, em 2022, já jogou 32 jogos da Série B pela equipa principal (2.202 minutos). Em novembro desse ano foi chamado à Seleção Sub-20. Passou ao América-MG em 2024 e 2026 é a época com mais minutos lá: 43 jogos e 2.668 minutos, em todas as competições.","br":"Estreou no Ponte Preta B em 2020 e, em 2022, já jogou 32 jogos da Série B pelo time principal (2.202 minutos). Em novembro daquele ano foi convocado para a Seleção Sub-20. Foi para o América-MG em 2024 e 2026 é a temporada com mais minutos lá: 43 jogos e 2.668 minutos, em todas as competições.","es":"Debutó en el Ponte Preta B en 2020 y, en 2022, ya jugó 32 partidos de la Série B con el primer equipo (2.202 minutos). En noviembre de ese año fue convocado con la selección sub-20. Pasó al América-MG en 2024 y 2026 es la temporada con más minutos allí: 43 partidos y 2.668 minutos, en todas las competiciones.","en":"He debuted at Ponte Preta B in 2020 and, in 2022, already played 32 Série B games for the first team (2,202 minutes). In November that year he was called up to the Brazil U-20s. He moved to América-MG in 2024 and 2026 is his season with most minutes there: 43 games and 2,668 minutes, in all competitions."},"fe_st2":{"pt":"É em 2026 que o passe longo vira assinatura: 3,48 certos por 90 contra uma mediana de 1,90, e 67,4% de acerto contra 56,8%. Outra base, o Wyscout, aponta o mesmo: nos passes progressivos de 40 m ou mais acertou 34 de 37 (91,9%). Em 2026 jogou 65% dos minutos de titular como volante e 35% como médio.","br":"É em 2026 que o passe longo vira assinatura: 3,48 certos por 90 contra uma mediana de 1,90, e 67,4% de acerto contra 56,8%. Outra base, o Wyscout, aponta o mesmo: nos passes progressivos de 40 m ou mais acertou 34 de 37 (91,9%). Em 2026 jogou 65% dos minutos como titular de volante e 35% de meio-campista.","es":"Es en 2026 cuando el pase largo se vuelve su firma: 3,48 acertados por 90 frente a una mediana de 1,90, y 67,4% de acierto frente a 56,8%. Otra base, Wyscout, apunta lo mismo: en los pases progresivos de 40 m o más acertó 34 de 37 (91,9%). En 2026 jugó el 65% de sus minutos de titular como pivote y el 35% como interior.","en":"In 2026 the long pass becomes his signature: 3.48 accurate per 90 against a median of 1.90, and 67.4% accuracy against 56.8%. Another database, Wyscout, points the same way: on progressive passes of 40 m or more he completed 34 of 37 (91.9%). In 2026 he played 65% of his starter minutes as a holding midfielder and 35% as a central midfielder."},"fo_9":{"pt":"<b>Relatórios Wyscout (Felipe e Palmberg).</b> Outra base de dados, com universo e período próprios (último ano; médios da Série B e da Primera Federación): os números diferem da Opta e servem de contraste. Único número usado: passes progressivos de 40 m ou mais do Felipe, 34 certos em 37.","br":"<b>Relatórios Wyscout (Felipe e Palmberg).</b> Outra base de dados, com universo e período próprios (último ano; meio-campistas da Série B e da Primera Federación): os números diferem da Opta e servem de contraste. Único número usado: passes progressivos de 40 m ou mais do Felipe, 34 certos em 37.","es":"<b>Informes Wyscout (Felipe y Palmberg).</b> Otra base de datos, con universo y periodo propios (último año; centrocampistas de la Série B y de la Primera Federación): las cifras difieren de Opta y sirven de contraste. Única cifra usada: pases progresivos de 40 m o más de Felipe, 34 acertados de 37.","en":"<b>Wyscout reports (Felipe and Palmberg).</b> Another database, with its own universe and period (last year; midfielders of the Série B and Primera Federación): the figures differ from Opta and serve as contrast. Only figure used: Felipe's progressive passes of 40 m or more, 34 completed out of 37."},"gi_st1":{"pt":"Passou pelas categorias de base do Santos e chegou ao Ajax, onde jogou pelo Ajax II na Eerste Divisie (2020 a 2023) e pelo Telstar em 2022. Voltou ao Brasil em 2023, no Fluminense, e fez parte do elenco campeão da Copa Libertadores daquele ano. Em 2024 chegou ao Ballkani, do Kosovo, depois de uma passagem curta pelo Amazonas.","br":"Passou pelas categorias de base do Santos e chegou ao Ajax, onde jogou pelo Ajax II na Eerste Divisie (2020 a 2023) e pelo Telstar em 2022. Voltou ao Brasil em 2023, no Fluminense, e fez parte do elenco campeão da Copa Libertadores daquele ano. Em 2024 chegou ao Ballkani, do Kosovo, depois de uma passagem curta pelo Amazonas.","es":"Pasó por las categorías inferiores del Santos y llegó al Ajax, donde jugó con el Ajax II en la Eerste Divisie (2020 a 2023) y con el Telstar en 2022. Volvió a Brasil en 2023, en el Fluminense, y formó parte de la plantilla campeona de la Copa Libertadores de ese año. En 2024 llegó al Ballkani, de Kosovo, tras un paso breve por el Amazonas.","en":"He came through the Santos youth ranks and reached Ajax, where he played for Ajax II in the Eerste Divisie (2020 to 2023) and for Telstar in 2022. He went back to Brazil in 2023, at Fluminense, and was part of the squad that won that year's Copa Libertadores. In 2024 he joined Ballkani, in Kosovo, after a short spell at Amazonas."},"gi_st2":{"pt":"2025/26 foi a época da afirmação: 31 jogos e 2.282 minutos na liga, 8 golos e 7 assistências, e 3 jogos na Conference League. Em 2026/27 já soma 4 golos e 1 assistência, incluindo o golo de 30/10 contra o Drenica, em jogo de 90 minutos. São 151 jogos como profissional e 24 golos.","br":"2025/26 foi a temporada da afirmação: 31 jogos e 2.282 minutos na liga, 8 gols e 7 assistências, e 3 jogos na Conference League. Em 2026/27 já soma 4 gols e 1 assistência, incluindo o gol de 30/10 contra o Drenica, em jogo de 90 minutos. São 151 jogos como profissional e 24 gols.","es":"2025/26 fue la temporada de la afirmación: 31 partidos y 2.282 minutos en liga, 8 goles y 7 asistencias, y 3 partidos en la Conference League. En 2026/27 ya suma 4 goles y 1 asistencia, incluido el gol del 30/10 contra el Drenica, en un partido de 90 minutos. Son 151 partidos como profesional y 24 goles.","en":"2025/26 was his breakthrough: 31 games and 2,282 minutes in the league, 8 goals and 7 assists, and 3 games in the Conference League. In 2026/27 he already has 4 goals and 1 assist, including the 30/10 goal against Drenica, in a 90-minute game. That is 151 games as a professional and 24 goals."},"pa_st1":{"pt":"Saiu do São Paulo e chegou ao Real Murcia em agosto de 2024. Na primeira época jogou 27 jogos (1.617 minutos) e na seguinte, 32 (1.624), com 2 golos.","br":"Saiu do São Paulo e chegou ao Real Murcia em agosto de 2024. Na primeira temporada jogou 27 jogos (1.617 minutos) e na seguinte, 32 (1.624), com 2 gols.","es":"Salió del São Paulo y llegó al Real Murcia en agosto de 2024. En la primera temporada jugó 27 partidos (1.617 minutos) y en la siguiente, 32 (1.624), con 2 goles.","en":"He left São Paulo and joined Real Murcia in August 2024. In his first season he played 27 games (1,617 minutes) and in the next, 32 (1,624), with 2 goals."},"pa_st2":{"pt":"Em 2026/27 já leva 9 jogos e 7 titularidades: 4 de interior no 4-3-3 e, em Antequera, segundo pivô no 4-2-3-1. Entre os médios do grupo destaca-se pelo passe seguro (88,9%) e pelas poucas perdas (7,4 por 90).","br":"Em 2026/27 já tem 9 jogos e 7 titularidades: 4 de meio-campista no 4-3-3 e, em Antequera, segundo volante no 4-2-3-1. Entre os meio-campistas do grupo se destaca pelo passe seguro (88,9%) e pelas poucas perdas (7,4 por 90).","es":"En 2026/27 ya lleva 9 partidos y 7 titularidades: 4 de interior en el 4-3-3 y, en Antequera, segundo pivote en el 4-2-3-1. Entre los centrocampistas del grupo destaca por el pase seguro (88,9%) y las pocas pérdidas (7,4 por 90).","en":"In 2026/27 he already has 9 games and 7 starts: 4 as an eight in the 4-3-3 and, at Antequera, as second pivot in the 4-2-3-1. Am /* dispersão com quadrantes e rótulos com linha-guia */
function dispersaoPro(d) {
  const W = d.W || 1000, H = d.H || 640, m = {l: 62, r: 22, t: 16, b: 52}, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const X = v => m.l + (v - d.x.min) / (d.x.max - d.x.min) * iw, Y = v => m.t + ih - (v - d.y.min) / (d.y.max - d.y.min) * ih;
  const cx = X(d.x.corte), cy = Y(d.y.corte), fx = d.x.fmt, fy = d.y.fmt;
  const Q = (x, y, w, h, c) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
  let s = `<svg class="sc" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.x.rot)} / ${esc(d.y.rot)}">`;
  s += Q(cx, m.t, m.l + iw - cx, cy - m.t, 'rgba(232,184,75,.13)') + Q(m.l, m.t, cx - m.l, cy - m.t, 'rgba(76,194,255,.08)') + Q(cx, cy, m.l + iw - cx, m.t + ih - cy, 'rgba(22,196,127,.08)') + Q(m.l, cy, cx - m.l, m.t + ih - cy, 'rgba(255,255,255,.012)');
  const ticks = (a, b, n) => Array.from({length: n + 1}, (_, i) => a + (b - a) * i / n);
  ticks(d.x.min, d.x.max, 5).forEach(v => { s += `<line class="sc-g" x1="${X(v)}" x2="${X(v)}" y1="${m.t}" y2="${m.t + ih}"/><text class="sc-t" x="${X(v)}" y="${m.t + ih + 18}" text-anchor="middle">${fx(v)}</text>`; });
  ticks(d.y.min, d.y.max, 5).forEach(v => { s += `<line class="sc-g" x1="${m.l}" x2="${m.l + iw}" y1="${Y(v)}" y2="${Y(v)}"/><text class="sc-t" x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${fy(v)}</text>`; });
  s += `<line class="sc-c" x1="${cx}" x2="${cx}" y1="${m.t}" y2="${m.t + ih}"/><line class="sc-c" x1="${m.l}" x2="${m.l + iw}" y1="${cy}" y2="${cy}"/>`;
  const qn = (x, y, a, t, c) => t ? `<text class="sc-q ${c || ''}" x="${x}" y="${y}" text-anchor="${a}">${t}</text>` : '';
  if (d.cantos) s += qn(m.l + iw - 12, m.t + 24, 'end', d.quad.ne, 'bom') + qn(m.l + 12, m.t + 24, 'start', d.quad.no) + qn(m.l + iw - 12, m.t + ih - 14, 'end', d.quad.se) + qn(m.l + 12, m.t + ih - 14, 'start', d.quad.so);
  else s += qn(m.l + iw - 12, cy - 12, 'end', d.quad.ne, 'bom') + qn(m.l + 12, cy - 12, 'start', d.quad.no) + qn(m.l + iw - 12, cy + 24, 'end', d.quad.se) + qn(m.l + 12, cy + 24, 'start', d.quad.so);
  s += `<text class="sc-e" x="${m.l + iw / 2}" y="${H - 10}" text-anchor="middle">${d.x.rot} →</text><text class="sc-e" transform="translate(16 ${m.t + ih / 2}) rotate(-90)" text-anchor="middle">${d.y.rot} →</text>`;
  d.pts.forEach((p, i) => { if (p.tipo === 'ctx') s += `<g class="sc-p" style="--d:${(i % 24) * 18}ms" data-tip="${esc(p.tip || p.nome)}"><circle class="hit" cx="${X(p.x)}" cy="${Y(p.y)}" r="${(d.rr || 7) + 6}"/><circle class="anel" cx="${X(p.x)}" cy="${Y(p.y)}" r="${(d.rr || 7) + 1.5}"/><circle class="mio" cx="${X(p.x)}" cy="${Y(p.y)}" r="${(d.rr || 7) - 2}"/></g>`; });
  const caixas = [], ptsObs = d.pts.filter(p => p.tipo !== 'ctx').map(p => ({x: X(p.x), y: Y(p.y), r: p.tipo === 'alvo' ? 24 : 12}));
  const bate = (a, b) => !(a.x + a.w < b.x || b.x + b.w < a.x || a.y + a.h < b.y || b.y + b.h < a.y);
  const nomeados = d.pts.filter(p => p.tipo !== 'ctx').sort((a, b) => (a.tipo === 'alvo' ? -1 : 0) - (b.tipo === 'alvo' ? -1 : 0));
  const rotulos = nomeados.map(p => {
    const px = X(p.x), py = Y(p.y), alvo = p.tipo === 'alvo', w = Math.max(p.nome.length, (p.sub || '').length) * (alvo ? 9.8 : 8.2) * (d.kf || 1) + 20, h = (p.sub ? 40 : 26) * (d.kf || 1), r0 = alvo ? (d.ra || 20) + 24 : (d.rr || 7) + 20;
    let best = null;
    for (const dist of [r0, r0 + 24, r0 + 52, r0 + 90]) {
      for (const a of [-45, -135, 45, 135, 0, 180, -90, 90, -20, -160, 20, 160]) {
        const rad = a * Math.PI / 180, ax = px + dist * Math.cos(rad), ay = py + dist * Math.sin(rad), b = {x: Math.cos(rad) >= 0 ? ax : ax - w, y: ay - h / 2, w, h};
        if (b.x < m.l + 2 || b.x + w > m.l + iw - 2 || b.y < m.t + 2 || b.y + h > m.t + ih - 2) continue;
        if (caixas.some(c => bate(b, c)) || ptsObs.some(o => o.x !== px && bate(b, {x: o.x - o.r, y: o.y - o.r, w: 2 * o.r, h: 2 * o.r}))) continue;
        best = {b, ax: Math.cos(rad) >= 0 ? b.x : b.x + w, ay}; break;
      }
      if (best) break;
    }
    if (!best) { const b = {x: Math.min(px + 30, m.l + iw - w - 2), y: Math.max(py - 40, m.t + 2), w, h}; best = {b, ax: b.x, ay: b.y + h / 2}; }
    caixas.push(best.b);
    return {p, px, py, alvo, ...best, w, h};
  });
  rotulos.forEach((r, i) => { const im = r.p.img, o = im ? 38 * (d.kf || 1) : 0, cid = 'scl' + d.id + i, k = d.kf || 1; s += `<g class="sc-r ${r.alvo ? 'alvo' : ''}" style="--d:${500 + i * 70}ms" data-tip="${esc(r.p.tip || r.p.nome)}"><path class="sc-guia" pathLength="1" d="M${r.px} ${r.py}L${r.ax} ${r.ay}"/><rect class="sc-cx" x="${r.b.x}" y="${r.b.y}" width="${r.w}" height="${r.h}" rx="4"/>` + (im ? `<clipPath id="${cid}"><circle cx="${r.b.x + 4 + 17 * k}" cy="${r.b.y + r.h / 2}" r="${17 * k}"/></clipPath><image href="${im}" x="${r.b.x + 4}" y="${r.b.y + r.h / 2 - 17 * k}" width="${34 * k}" height="${34 * k}" clip-path="url(#${cid})"/>` : '') + `<text x="${r.b.x + 9 + o}" y="${r.b.y + 16 * k}" class="sc-n">${esc(r.p.nome)}</text>${r.p.sub ? `<text x="${r.b.x + 9 + o}" y="${r.b.y + 31 * k}" class="sc-s">${esc(r.p.sub)}</text>` : ''}</g>`; });
  d.pts.filter(p => p.tipo !== 'ctx').forEach((p, i) => {
    const a = p.tipo === 'alvo', R = (d.rr || 7) + (a ? 3 : 0), x = X(p.x), y = Y(p.y);
    s += `<g class="sc-p ${a ? 'alvo' : 'ref'}" style="--d:${300 + i * 60}ms" data-tip="${esc(p.tip || p.nome)}"><circle class="anel" cx="${x}" cy="${y}" r="${R + 1.5}"/><circle class="mio" cx="${x}" cy="${y}" r="${R - 2}"/></g>`;
  });
  return s + '</svg>';
}

/* radar de passes com a frente para cima e o resumo por direcao */
function mapaRosa() {
  const M = D.fe.mapas[EST_M.rec], el = document.getElementById('mapR'); if (!el) return;
  const S_ = M.rosa[EST_M.ros]; el.innerHTML = rosa(S_);
  let f = 0, l = 0, t = 0; S_.forEach((v, i) => { const ang = Math.min(i * 22.5, 360 - i * 22.5), n = v[0]; if (ang < 45) f += n; else if (ang === 45) { f += n / 2; l += n / 2; } else if (ang > 135) t += n; else if (ang === 135) { t += n / 2; l += n / 2; } else l += n; });
  const tot = Math.max(1, f + l + t), tx = document.getElementById('mapRt');
  if (tx) tx.textContent = T('fm_rt').replace('{f}', N(f / tot * 100, 0)).replace('{l}', N(l / tot * 100, 0)).replace('{t}', N(t / tot * 100, 0));
}

      <div class="pn-h" style="margin-top:6px"><span class="bt">${T('gm_lista')}</span>${seg('gfl', [['todos', T('gl_all')], ['gol', T('gl_gs')], ['ass', T('gl_as')], ['dir', T('pe_dir')], ['esq', T('pe_esq')], ['cab', T('pe_cab')]], EST_G.f, 1)}</div><div class="gl-w" id="glL"></div></div>
    <div class="pn rise" style="grid-column:3;grid-row:1"><div class="pn-h"><span class="bt">${T('gm_foot')}</span></div>
      <div class="pp" style="height:44px">${p.map(x => `<div style="flex:${x[1]};background:${x[2]};${x[0] === 'nd' ? 'color:#EDEDF0' : ''}" data-tip="${x[1]} ${x[0] === 'nd' ? T('pe_nd') : T('pe_' + x[0])}">${x[0] === 'nd' ? '?' : x[1]}</div>`).join('')}</div>
      <div class="leg">${p.map(x => `<span><i style="background:${x[2]}"></i>${x[0] === 'nd' ? T('pe_nd') : T('pe_' + x[0])}</span>`).join('')}</div><p class="tx" style="margin-top:8px">${ft}</p><div class="pn-h" style="margin-top:14px"><span class="bt">${T('gm_pro')}</span></div>${D.gi.prod.map(x => `<div class="pr-r"><span>${T(x.l)}</span><b>${x.j} ${T('u_j')}</b><b>${x.g} G</b><b>${x.a} A</b></div>`).join('')}</div>

/* formacoes: os capitaes e a base ficam; so entram as pecas */
function campoCen(c, big) {
  const tp = TPL[c.f]; let s = ''; const NOM = {F: 'Felipe', P: 'Palmberg', G: 'Giovanni'}, FA = {F: 'face_fe', P: 'face_pa', G: 'face_gi'}, CAP = ['Dani Jiménez', 'Jorge Mier', 'Alberto González', 'Óscar Gil'];
  Object.entries(c.slots).forEach(([fp, v]) => {
    const [x, y] = tp[fp], cx = x * 3, cy = y * 2, ours = !!NOM[v], nm = ours ? NOM[v] : nomeCurto(v), fk = ours ? FA[v] : D.faces[nm], R = ours ? 16 : 12.5, id = `fc${c.i}${fp}${big ? 'b' : ''}`, cap = CAP.includes(v);
    s += `<clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath><circle cx="${cx}" cy="${cy}" r="${R + 1.6}" fill="#0e0e13" stroke="${ours ? 'var(--gold)' : cap ? '#EDEDF0' : '#7b8c94'}" stroke-width="${ours ? 2.2 : cap ? 1.8 : 1}"/>${fk ? `<image href="${A(fk)}" x="${cx - R}" y="${cy - R}" width="${2 * R}" height="${2 * R}" clip-path="url(#${id})"/>` : ''}<text class="${ours ? 'pl-a' : 'pl-n'}" x="${cx}" y="${cy + R + 10}">${esc(nm)}</text>`;
  });
  return pitch(s + `<g><line x1="214" y1="8" x2="280" y2="8" stroke="#E8B84B" stroke-width="2.2"/><path d="M279 3.5L290 8L279 12.5z" fill="#E8B84B"/></g>`);
}
function formacoes() {
  const cards = D.cl.cenarios.map((c, i) => { c.i = i; const nm = FMT[c.f] + ' · ' + T(c.x);
    return `<article class="xc xp rise">${fecha}<div class="xp-cl" style="display:flex;flex-direction:column;height:100%;gap:5px"><div class="pn-h"><b>${nm}</b><small>${T('fs_a' + c.k + '_u')}</small></div><div class="pw">${campoCen(c)}</div><p class="tx">${T('fs_a' + c.k + '_t')}</p></div><span class="mais">+ ${T('u_abrir')}</span>
      <div class="xp-det"><div class="fx2"><div class="pw">${campoCen(c, 1)}</div><div><div class="kick">${T('fs_k')}</div><h3>${nm}</h3><p class="tx">${T('fs_a' + c.k + '_t')}</p><p class="tx cap">${T('fs_ng')}</p></div></div></div></article>`; }).join('');

  return hd(T('fs_k'), T('fs_h'), T('fs_s')) + `<div class="xg fs fs6">${cards}${regras}</div>`;
}

document.addEventListener('play', e => { if (e.target.tagName === 'VIDEO') document.querySelectorAll('video').forEach(v => { if (v !== e.target) v.pause(); }); }, true);

/* Celular: modo, menu, deslizar para trocar de tela. Carregado por ultimo; a ultima declaracao de pcFit vale. */
const ehMob = () => innerWidth < 820 || (innerWidth < 1000 && innerHeight > innerWidth);
function pcFit() {
  const palco = document.getElementById('pcPalco'); if (!palco) return;
  const mob = ehMob(); document.body.classList.toggle('mob', mob);
  if (mob) { palco.style.transform = 'none'; palco.style.width = innerWidth + 'px'; palco.style.height = innerHeight + 'px'; return; }
  const k = Math.min(innerWidth / 1440, innerHeight / 900);
  palco.style.transform = 'scale(' + k + ')'; palco.style.width = (innerWidth / k) + 'px'; palco.style.height = (innerHeight / k) + 'px';
}
let modoAnt = null;
addEventListener('resize', () => { const m = ehMob(); if (modoAnt !== null && m !== modoAnt && typeof montaTudo === 'function') { modoAnt = m; document.body.classList.toggle('mob', m); montaTudo(); dkVai(atual); } else modoAnt = m; });
document.addEventListener('DOMContentLoaded', () => { modoAnt = ehMob(); });
document.addEventListener('click', e => {
  const mn = document.getElementById('mn'); if (!mn) return;
  if (e.target.closest('#burger')) { mn.classList.toggle('open'); return; }
  if (e.target.closest('.mn button') || e.target.closest('.langs button')) mn.classList.remove('open');
});
let tx0 = 0, ty0 = 0, tt0 = 0;
document.addEventListener('touchstart', e => { const t = e.touches[0]; tx0 = t.clientX; ty0 = t.clientY; tt0 = Date.now(); }, {passive: true});
document.addEventListener('touchend', e => {
  if (!document.body.classList.contains('mob')) return;
  const t = e.changedTouches[0], dx = t.clientX - tx0, dy = t.clientY - ty0;
  if (Math.abs(dx) > 90 && Math.abs(dy) < 40 && Date.now() - tt0 < 500 && !e.target.closest('video,.seg,.sc,.gl-w,.xp.aberto,.mn,.dp')) dkVai(atual + (dx < 0 ? 1 : -1));
}, {passive: true});
