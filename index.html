*{box-sizing:border-box}
:root{--bg:#0d0d0d;--card:#151514;--card2:#100f0e;--line:#262624;--line2:#1c1c1a;--txt:#d6d6d3;--strong:#fff;--mut:#a3a39f;--soft:#8d8d89;--gold:#e8b84b;--red:#d03b3b;--track:#20201d;--chip:#23231f;--sqline:#33302c;--grid:rgba(232,232,230,.05);--fbg:#0f1a11;--fline:#2c3a2e;
--disp:'Bebas Neue','DejaVu Sans Condensed','Arial Narrow',Impact,sans-serif;--body:Poppins,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',Consolas,monospace}
html{scroll-behavior:smooth;background:var(--bg)}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--txt);font:400 19px/1.6 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
b,strong{color:var(--strong);font-weight:600}
a{color:var(--gold)}
img{max-width:100%}
button{font-family:inherit}
h1,h2,h3,h4{margin:0;font-weight:400}
p{margin:0}
.devbanner{position:fixed;z-index:99;left:0;right:0;bottom:0;background:#a21;color:#fff;font:700 12px var(--mono);text-align:center;padding:3px;letter-spacing:1px;pointer-events:none}
.wrap{max-width:1340px;margin:0 auto;padding:0 28px}

/* barra fixa */
.topbar{position:fixed;z-index:50;top:0;left:0;right:0;background:rgba(13,13,13,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1320px;margin:0 auto;padding:10px 28px;display:flex;align-items:center;gap:24px}
.brand-link{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.brand-link .l4{height:30px}.brand-link .cr{height:40px}.brand-link .x{font:400 24px var(--disp);color:var(--red)}
#navlinks{display:flex;gap:6px;flex:1;justify-content:center}
#navlinks a{color:var(--mut);text-decoration:none;font:600 14px var(--body);letter-spacing:1.5px;text-transform:uppercase;padding:9px 14px;border-radius:8px}
#navlinks a:hover{color:#fff}
#navlinks a.on{color:#fff;background:#1f1f1c;box-shadow:inset 0 -2px 0 var(--red)}
.langs{display:flex;gap:8px;flex:none}
.langs button{font:700 18px/1 var(--body);letter-spacing:1px;color:#e8e8e6;background:#1a1a18;border:2px solid #44423d;border-radius:10px;min-width:60px;height:46px;padding:0 16px;cursor:pointer}
.langs button:hover{border-color:#8a867c}
.langs button.on{background:var(--red);border-color:var(--red);color:#fff}
.langs button:focus-visible,#navlinks a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{padding-top:68px}

/* tipografia */
.kick{font:600 15px/1.2 var(--body);letter-spacing:4px;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
section h2{font:400 clamp(40px,5.2vw,68px)/1 var(--disp);letter-spacing:1px;color:#fff;border-left:8px solid var(--red);padding-left:20px;margin-bottom:34px}
.blk{margin-top:84px}
.blk h3{font:400 clamp(30px,3.4vw,42px)/1.05 var(--disp);letter-spacing:.8px;color:#fff}
.blead{color:var(--mut);margin:6px 0 22px;font-size:19px}
.srclink{display:inline-block;margin-top:46px;font:600 15px var(--mono);letter-spacing:1px;text-decoration:none;color:var(--mut);border-bottom:1px solid #4a4742}
.srclink:hover{color:var(--gold)}
section{scroll-margin-top:70px}

/* avatar */
.av{position:relative;flex:none;display:block;width:var(--s,80px);height:var(--s,80px);border-radius:50%;border:4px solid var(--gold);overflow:hidden;background:radial-gradient(circle at 50% 30%,#4a2222,#1a1414 75%)}
.av i{position:absolute;inset:0;background-size:150% auto;background-position:50% 2%;background-repeat:no-repeat}
.av.mono{background:#2b2b28;border-color:#5b5649;display:flex;align-items:center;justify-content:center;font:400 calc(var(--s,80px)*.42)/1 var(--disp);color:#c9c5b8}
.av.sm{border-width:3px}
.pill{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 16px;font:500 18px/1.2 var(--body);color:#e8e8e6;margin:0 8px 8px 0}
.pill b{color:var(--gold)}
.pill.gold{background:#2a230f;border-color:#6a5314;color:var(--gold)}

/* hero */
.hero{padding:70px 0 80px;background:radial-gradient(1100px 600px at 80% 30%,rgba(208,59,59,.28),transparent 62%),radial-gradient(800px 500px at 10% 100%,rgba(232,184,75,.12),transparent 62%),linear-gradient(180deg,#120d0d,#0d0d0d)}
.hero h1{font:400 clamp(46px,7vw,100px)/.95 var(--disp);letter-spacing:1.5px;color:#fff;max-width:1000px}
.hsub{font:300 clamp(20px,2.2vw,28px)/1.35 var(--body);color:#ececea;margin:20px 0 40px;max-width:760px}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.pcard{display:flex;align-items:flex-end;background:linear-gradient(135deg,#1b1313,#141413);border:1px solid var(--sqline);border-radius:26px;overflow:hidden;min-height:420px;position:relative}
.pcard.palmberg{background:linear-gradient(135deg,#1c1810,#141413)}
.pcard .ph{position:absolute;right:-30px;bottom:0;width:62%;line-height:0}
.pcard .ph:before{content:'';position:absolute;left:12%;right:0;top:14%;bottom:0;background:radial-gradient(circle at 50% 35%,rgba(208,59,59,.4),transparent 65%)}
.pcard.palmberg .ph:before{background:radial-gradient(circle at 50% 35%,rgba(232,184,75,.35),transparent 65%)}
.pcard .ph img{position:relative;width:100%;height:auto}
.pcard .pi{position:relative;z-index:2;padding:30px 28px;max-width:60%;align-self:flex-start}
.pcard h2{font:400 clamp(40px,4vw,56px)/1 var(--disp);border:0;padding:0;margin:0 0 6px;color:#fff}
.pcard .role{font:600 18px var(--body);color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:18px}
.hdate{margin-top:26px;font:400 15px var(--mono);color:var(--soft);letter-spacing:1px}

/* por qué encajan */
.why-sec{padding:90px 0}
.why-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.why{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 30px;display:flex;flex-direction:column}
.why .wh{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.why .who{font:600 15px var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
.why h3{font:400 34px/1.05 var(--disp);color:#fff;letter-spacing:.6px}
.why .big{font:400 110px/1 var(--disp);color:var(--gold);margin:6px 0 2px}
.why .big small{font:400 22px var(--body);color:var(--mut);margin-left:12px;letter-spacing:0;display:inline-block;vertical-align:middle;max-width:55%;line-height:1.25}
.why .cmp{font:500 20px/1.4 var(--body);color:#ececea;margin-top:6px}
.why .ctx{font:400 16px/1.5 var(--body);color:var(--mut);margin-top:12px;border-top:1px solid var(--line);padding-top:12px}

/* seções de jogador */
.psec{padding:90px 0 70px;border-top:1px solid var(--line2)}
.psec.g{background:linear-gradient(180deg,#110f0a,#0d0d0d 40%)}
.shead{display:flex;align-items:center;gap:22px;margin-bottom:34px}
.shead h2{margin:0}
.ficha{display:grid;grid-template-columns:380px 1fr;gap:44px;align-items:start}
.portrait{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--sqline);background:radial-gradient(circle at 50% 28%,rgba(208,59,59,.4),#161414 72%);line-height:0}
.portrait.g{background:radial-gradient(circle at 50% 28%,rgba(232,184,75,.32),#161414 72%)}
.portrait img{width:100%;height:auto;display:block}
.fr h3{font:400 32px/1.1 var(--disp);color:#fff;margin:22px 0 12px;letter-spacing:.8px}
.facts{display:flex;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font:400 46px/1 var(--disp);color:var(--gold)}
.stat span{font:400 15px/1.3 var(--body);color:var(--mut)}
.tits{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.tits li{background:#1d1708;border:1px solid #6a5314;color:var(--gold);border-radius:999px;padding:6px 16px;font:500 16px var(--body)}
.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.hc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.hc .rk{font:600 15px var(--mono);letter-spacing:2px;color:var(--gold)}
.hc .v{font:400 64px/1 var(--disp);color:#fff;margin:4px 0}
.hc .l{font:400 16px/1.35 var(--body);color:var(--txt)}
.cap{margin-top:12px;font:400 16px/1.4 var(--body);color:var(--mut)}

/* radar */
.radwrap{display:grid;grid-template-columns:minmax(0,460px) 1fr;gap:34px;align-items:center}
.radar{width:100%;height:auto}
.radar .ring{fill:none;stroke:#2c2b28;stroke-width:1.5}
.radar .axis{stroke:#2c2b28;stroke-width:1.5}
.radar .poly{fill:rgba(232,184,75,.28);stroke:var(--gold);stroke-width:3.5}
.radar .dot{fill:var(--gold)}
.radar .nb{fill:#23231f;stroke:#4a4742;stroke-width:1.5}
.radar text{font:700 17px var(--mono);fill:#e8e8e6;text-anchor:middle;dominant-baseline:central}
.ml{display:grid;gap:8px}
.ml .r{display:grid;grid-template-columns:34px 1fr auto 62px;gap:4px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:18px}
.ml .r i{font:700 16px var(--mono);font-style:normal;color:var(--gold)}
.ml .r em{font:600 18px var(--mono);color:#fff;font-style:normal}
.ml .r u{font:700 18px var(--mono);color:var(--gold);text-decoration:none;text-align:right}
.ml .rb{grid-column:2/5;height:6px;border-radius:3px;background:var(--track);overflow:hidden;display:block}
.ml .rb s{display:block;height:100%;background:var(--gold);border-radius:3px}

/* tabelas */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;min-width:760px;border-collapse:collapse;table-layout:fixed}
.tbl th{font:600 15px/1.15 var(--body);letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);text-align:right;padding:0 12px 12px;border-bottom:2px solid #34322e;vertical-align:bottom}
.tbl th:first-child,.tbl td:first-child{text-align:left;width:25%;padding-left:12px}
.tbl th small{display:block;font:400 14px/1.25 var(--mono);letter-spacing:0;text-transform:none;color:var(--soft);margin-top:4px}
.tbl th.ath{color:#fff}
.tbl td{height:46px;padding:0 12px;text-align:right;font:500 21px/1 var(--body);color:#dcdcd8;border-bottom:1px solid #22221f;font-variant-numeric:tabular-nums}
.tbl td:first-child{font:400 25px/1 var(--disp);letter-spacing:.7px;color:#fff}
.tbl td.ath,.tbl th.ath{background:rgba(255,255,255,.045)}
.tbl td.best{color:var(--gold);font-weight:700}
.tbl td.none{color:#55534f}
.tbl td.med,.tbl th.med{color:#8d8d89;font-weight:400}
.tbl tr.sep td{border-top:2px dashed #6a5314}
.tnote{margin-top:14px;font:400 16px/1.4 var(--body);color:var(--mut)}

/* mapas */
.mapsrow{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.mapcol h3{font:400 34px/1 var(--disp);letter-spacing:.8px;color:#fff;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.mapcol h3 small{font:400 16px/1 var(--body);color:var(--mut);letter-spacing:0}
.mapcell{border-radius:16px;overflow:hidden;border:2px solid var(--fline);background:var(--fbg);aspect-ratio:105/68;position:relative}
.mapcell svg{display:block;width:100%;height:100%}
.maplegend{margin-top:8px;font:400 16px/1.35 var(--body);color:var(--mut);display:flex;gap:12px;align-items:center;flex-wrap:wrap;min-height:24px}
.maplegend b{color:#fff}
.rampbar{display:inline-block;width:110px;height:12px;border-radius:6px;background:linear-gradient(90deg,#3a1414,#d03b3b,#e8b84b,#fff4c4)}
.pitch-t{font:400 66px var(--disp);fill:#14110a;text-anchor:middle;letter-spacing:.5px}
.pitch-t.s{font-size:46px}
.pitch-c{font:600 24px var(--body);fill:#14110a;text-anchor:middle}
.pitch-t.w,.pitch-c.w{fill:#fff}
.pnum{font:400 34px var(--disp);fill:#14110a;text-anchor:middle}

/* campo das funções */
.fn-split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:26px;align-items:start}
.fn-pitch{border-radius:16px;overflow:hidden;border:2px solid var(--fline);background:var(--fbg);aspect-ratio:105/68}
.fn-pitch svg{display:block;width:100%;height:100%}
.zone{cursor:pointer}
.zone.hl rect.zr{stroke:#fff;stroke-width:5}
.fn-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fc{background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;transition:background .2s}
.fc.soft{border-style:dashed;border-color:#7a6a3a}
.fc.hl{background:#1f1a0b}
.fc .lb{font:600 14px/1.15 var(--mono);letter-spacing:1.2px;color:var(--gold);text-transform:uppercase}
.fc .pc{font:400 68px/1 var(--disp);color:var(--gold);margin-top:2px;white-space:nowrap}
.fc .pc small{font:400 15px var(--body);color:var(--mut);margin-left:6px}
.fc .ds{font:400 16px/1.35 var(--body);color:var(--txt);margin-top:2px}
.fc .bar{margin-top:10px;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.fc .bar i{display:block;height:100%;background:var(--gold)}

/* contadores */
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.counter{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.counter .v{font:400 54px/1 var(--disp);color:var(--gold);white-space:nowrap}
.counter .l{font:400 15px/1.3 var(--body);color:var(--txt);margin-top:4px}
.natband{margin-top:16px;border:1px solid #6a5314;background:#1d1708;border-radius:14px;padding:14px 20px}
.natband p{font:500 19px/1.4 var(--body);color:#ece4cc}

/* semelhantes */
.simrow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.sim{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;display:flex;flex-direction:column}
.sim .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sim .pct{font:400 58px/1 var(--disp);color:var(--gold);white-space:nowrap}
.sim .pct small{font:400 24px var(--disp)}
.sim h4{font:400 30px/1.05 var(--disp);letter-spacing:.6px;color:#fff;margin-top:12px}
.sim .cx{font:400 14px/1.35 var(--mono);color:var(--mut);margin-top:6px;min-height:58px}
.sim ul{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.sim li{position:relative;padding:9px 0 9px 22px;font:400 17px/1.3 var(--body);color:#e4e4e1;border-bottom:1px solid #20201e}
.sim li:before{content:'';position:absolute;left:2px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--gold)}

/* vídeo */
.vwrap{max-width:900px}
.vwrap.vert{max-width:340px}
.vwrap.v169{max-width:900px}
.vwrap.v169 .vbox{aspect-ratio:16/9}
.vwrap.v45 .vbox{aspect-ratio:4/5}
.vwrap.vert .vbox{aspect-ratio:9/16}
.vbox video{display:block}
.vbox{border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--sqline);line-height:0}
.vbox video{width:100%;height:100%;object-fit:contain;background:#000}
.vtabs{display:flex;gap:10px;margin-top:12px}
.vtabs button{font:600 16px var(--mono);letter-spacing:1px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 16px;cursor:pointer}
.vtabs button.on{color:#111;background:var(--gold);border-color:var(--gold)}
.vph{padding:60px 20px;text-align:center;color:var(--mut);line-height:1.4}

/* encaje */
.enc{padding:90px 0;border-top:1px solid var(--line2);background:radial-gradient(900px 500px at 50% 0%,rgba(208,59,59,.14),transparent 65%)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.field{margin:0}
.field h3{font:400 38px/1.05 var(--disp);color:#fff;margin-bottom:12px}
.chg{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.chg li{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:12px;padding:12px 16px;font:400 18px/1.4 var(--body)}
.chg li b{display:block;font:400 28px/1.1 var(--disp);letter-spacing:.6px;color:#fff}
.enc .leg{margin-top:16px;font:400 16px/1.4 var(--body);color:var(--mut)}

/* próximos pasos */
.pasos{padding:80px 0;border-top:1px solid var(--line2)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.step i{font:400 44px/1 var(--disp);color:var(--red);font-style:normal}
.step b{display:block;font:400 30px/1.05 var(--disp);letter-spacing:.7px;margin-top:2px}
.step p{font:400 17px/1.4 var(--body);margin-top:6px;color:var(--mut)}

/* fontes */
.fuentes{padding:50px 0;border-top:1px solid var(--line2)}
.fuentes summary{cursor:pointer;list-style:none;display:block;padding:14px 0}
.fuentes summary::-webkit-details-marker{display:none}
.fuentes summary h2{margin:0;display:inline-block}
.fuentes summary .kick{display:block}
.fuentes summary:after{content:'+';float:right;font:400 52px/1 var(--disp);color:var(--gold)}
.fuentes details[open] summary:after{content:'–'}
.mt{width:100%;min-width:760px;border-collapse:collapse;font-size:16px;line-height:1.45;margin-top:18px}
.mt th{font:600 14px/1.1 var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);text-align:left;padding:0 10px 8px;border-bottom:2px solid #34322e}
.mt td{padding:9px 10px;border-bottom:1px solid #22221f;vertical-align:top;color:#dcdcd8}
.mt td:first-child{font:400 24px/1.1 var(--disp);color:#fff;white-space:nowrap}
.lim{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 26px;margin-top:26px}
.lim h3{font:400 32px/1 var(--disp);letter-spacing:.8px;color:#fff;margin-bottom:8px}
.lim ul{margin:0;padding:0 0 0 22px}
.lim li{font:400 16px/1.45 var(--body);margin-bottom:6px;color:#d4d4d1}
.lim li b{color:#fff}

/* contato */
.contact{padding:80px 0;border-top:1px solid var(--line2);text-align:center;background:radial-gradient(800px 400px at 50% 40%,rgba(208,59,59,.18),transparent 65%)}
.contact img{height:70px;width:auto}
.contact .ct{font:400 24px/1.6 var(--body);color:#ececea;margin-top:22px}
.contact .ct a{text-decoration:none}
.contact .pf{font:400 15px var(--mono);color:var(--mut);margin-top:30px;letter-spacing:1px}

body.sl{--nav:58px;--pad:clamp(16px,3.2vw,60px);font-size:clamp(16px,1.15vw,19px);overflow-x:clip}
html{scroll-padding-top:calc(var(--nav) + 6px);scroll-behavior:smooth}

/* barra superior: etiquetas inclinadas, contador e índice */
.sl-prog{position:fixed;z-index:80;top:0;left:0;height:3px;width:0;background:var(--gold);transition:width .12s linear}
.sl-bar{position:fixed;z-index:70;inset:0 0 auto 0;height:var(--nav);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 var(--pad);pointer-events:none;
  background:linear-gradient(180deg,rgba(13,13,13,.92) 0,rgba(13,13,13,.78) 60%,rgba(13,13,13,0) 100%)}
.sl-bar>*{pointer-events:auto}

.sl-t{display:inline-flex;align-items:center;height:32px;padding:0 20px;font:700 12.5px/1 var(--body);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);margin-right:-8px;max-width:100%}
.sl-t.a{background:var(--gold);color:#0d0d0d;flex:none}

  background:var(--gold);color:#0d0d0d;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}

.sl-idx{position:fixed;inset:0;z-index:90;background:rgba(10,10,10,.97);backdrop-filter:blur(10px);display:none;overflow:auto;padding:calc(var(--nav) + 20px) var(--pad) 40px}

.sl-idx a{display:flex;align-items:baseline;gap:14px;padding:16px 20px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-decoration:none;color:#fff;min-height:64px}
.sl-idx a:hover,.sl-idx a:focus-visible{border-color:var(--gold);outline:0}

/* cada seção é uma tela */
body.sl .sec,body.sl .hero{position:relative;min-height:100svh;padding:calc(var(--nav) + 34px) 0 56px;border-top:0;scroll-margin-top:0}
body.sl .sec{display:flex;flex-direction:column;justify-content:center;overflow:hidden}

body.sl .sec::before{content:attr(data-n);position:absolute;right:max(1vw,8px);bottom:-.16em;font:400 clamp(180px,30vw,520px)/.8 var(--disp);color:rgba(255,255,255,.028);pointer-events:none;letter-spacing:-.02em}
body.sl .wrap{max-width:1760px;padding:0 var(--pad);position:relative;z-index:1}
body.sl .kick{font:700 clamp(12px,.95vw,14.5px)/1.3 var(--body);letter-spacing:.22em;color:var(--gold);margin-bottom:14px}

body.sl .blead{font:400 clamp(17px,1.35vw,22px)/1.5 var(--body);color:#cfcfcb;max-width:44ch}
body.sl .note{max-width:none}

/* telas em duas colunas: título à esquerda (fixo), conteúdo à direita */
@media (min-width:1100px){
  body.sl .sec.sl-2c>.wrap{display:grid;grid-template-columns:minmax(300px,27%) minmax(0,1fr);column-gap:clamp(32px,4.6vw,96px);align-items:start}

}

/* abertura */
body.sl .hero{display:flex;align-items:center;background:radial-gradient(1200px 700px at 85% 30%,rgba(208,59,59,.30),transparent 62%),radial-gradient(900px 520px at 8% 100%,rgba(232,184,75,.10),transparent 60%),#0d0d0d}

body.sl .hero h1{font:400 clamp(46px,7.6vw,150px)/.9 var(--disp);max-width:15ch;text-wrap:balance}

@media (min-width:1100px){
  body.sl .hero>.wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);column-gap:clamp(28px,4vw,80px);align-items:center}
  body.sl .hero>.wrap>.kick,body.sl .hero>.wrap>h1,body.sl .hero>.wrap>.hsub{grid-column:1}
  body.sl .hero>.wrap>.p4{grid-column:2;grid-row:1 / span 3;margin-top:0;grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* cartões: preenchem a largura disponível */
body.sl .bxs{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:clamp(12px,1.4vw,22px)}
body.sl .bx{padding:clamp(16px,1.6vw,26px)}
body.sl .bx b{font-size:clamp(46px,4.4vw,78px)}
body.sl .bx h4{font-size:clamp(22px,1.8vw,30px)}
body.sl .bx p{font-size:clamp(15px,1.05vw,17.5px)}
body.sl .gaps{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:clamp(12px,1.4vw,22px)}
body.sl .gap{padding:clamp(18px,1.8vw,30px)}
body.sl .gap h4{font-size:clamp(24px,2vw,34px)}
body.sl .gap p{font-size:clamp(15.5px,1.1vw,18px)}
body.sl .cart{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
body.sl .fgrid{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(14px,1.6vw,26px)}
body.sl .pk{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
body.sl .rl p{max-width:none;font-size:clamp(17px,1.3vw,21px)}
body.sl .two{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}

/* peças: retrato fixo à esquerda e conteúdo em duas colunas */
body.sl .sec.sl-wide>.wrap{display:block}
body.sl .sec.sl-wide .sl-head{max-width:1100px}
body.sl .pb{grid-template-columns:minmax(0,1fr);gap:28px}
@media (min-width:900px){
  body.sl .pb{grid-template-columns:minmax(230px,300px) minmax(0,1fr);gap:clamp(24px,3vw,56px)}

}
@media (min-width:1200px){
  body.sl .pb>div:nth-child(2){columns:2 minmax(380px,1fr);column-gap:clamp(28px,3vw,52px)}

  body.sl .pb>div:nth-child(2)>.l,body.sl .pb>div:nth-child(2)>.pk,body.sl .pb>div:nth-child(2)>.vid,body.sl .pb>div:nth-child(2)>.vlink,body.sl .pb>div:nth-child(2)>.lpg,
  body.sl .pb>div:nth-child(2)>.lpl,body.sl .pb>div:nth-child(2)>.cen,body.sl .pb>div:nth-child(2)>.tw,body.sl .pb>div:nth-child(2)>.note{column-span:all}
  body.sl .pb>div:nth-child(2)>h3{break-after:avoid}
}
body.sl .pb p.l{font-size:clamp(17px,1.3vw,21px);max-width:none}
body.sl .pb h3{font-size:clamp(26px,1.9vw,34px)}
body.sl .portrait{max-width:300px}
body.sl .vid{margin:6px 0 22px}

/* tabelas: rolam por dentro, com dica de rolagem no celular */
body.sl .tw{border:1px solid var(--line);border-radius:14px;background:#10100f}
body.sl .tw::after{display:none}
@media (max-width:760px){
  body.sl .tw{position:relative}
  body.sl .tw::after{display:block;content:"\2194";position:absolute;right:10px;top:10px;color:#0d0d0d;background:var(--gold);width:28px;height:28px;border-radius:50%;text-align:center;line-height:28px;font-size:16px;margin:0;pointer-events:none;opacity:.9}
}
body.sl .fuentes{padding:calc(var(--nav) + 20px) 0 80px;border-top:1px solid var(--line2);min-height:0}
body.sl #footnote{padding:28px 0 60px}

/* celular: tudo em uma coluna, barra compacta, alvos de toque grandes */
@media (max-width:760px){
  body.sl{--nav:52px}
  body.sl .sec,body.sl .hero{min-height:0;padding:calc(var(--nav) + 18px) 0 40px}
  body.sl .sec{justify-content:flex-start}
  body.sl .hero{min-height:100svh}
  body.sl .sec::before{font-size:46vw;right:-4vw}
  .sl-t{padding:0 16px;font-size:11px;height:30px}
  .sl-t.a{padding:0 14px 0 12px}
  .sl-t.a .tx{display:none}
  .sl-idx-b{height:32px;padding:0 16px;font-size:11px}
  .sl-bar .langs{display:none}
  .sl-idx .langs{display:flex}
  body.sl .hero h1{font-size:clamp(44px,13vw,70px)}
  body.sl .p4{margin-top:30px}
  body.sl h2{font-size:clamp(36px,10.5vw,54px)}
  body.sl .blead{font-size:17px}
}
@media (max-width:380px){ .sl-t.c{padding:0 12px} .sl-t.b{padding:0 12px} }
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.sl-prog{transition:none}}

/* sub-tela das peças: gráficos, mapas e vídeo em grade */
body.sl .sl-sub{justify-content:flex-start}
body.sl .sl-sub h2 small{font:700 .32em/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-left:12px;vertical-align:middle}
body.sl .sl-sub .sl-head{margin-bottom:22px}
body.sl .sl-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:clamp(14px,1.6vw,26px);align-items:start}
body.sl .sl-g{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(14px,1.5vw,24px)}
body.sl .sl-g.wide{grid-column:1/-1}
body.sl .sl-g>h3{margin:0 0 12px;font-size:clamp(22px,1.7vw,30px)}
body.sl .sl-g>:last-child{margin-bottom:0}
body.sl .sl-g .vid{margin:0}
body.sl .sl-g .vid video{max-height:62vh;object-fit:contain;background:#000}
body.sl .sl-g svg{max-width:100%}
body.sl .sl-sub::before{display:none}

/* ajustes de encaixe nas telas de 2 colunas */
@media (min-width:1100px){
  body.sl .sec.sl-2c .bxs{grid-template-columns:repeat(3,minmax(0,1fr))}
  body.sl .sec.sl-2c .gaps{grid-template-columns:repeat(2,minmax(0,1fr))}
  body.sl .sec.sl-2c .bx{padding:clamp(14px,1.2vw,20px)}
  body.sl .sec.sl-2c .bx p{font-size:clamp(13.5px,.92vw,16px);line-height:1.42}
  body.sl .sec.sl-2c .bx b{font-size:clamp(40px,3.6vw,64px)}
  body.sl .sec.sl-2c .bx h4{font-size:clamp(20px,1.5vw,26px);margin:4px 0 8px}
  body.sl .sec.sl-2c .gap{padding:clamp(14px,1.3vw,22px)}
  body.sl .sec.sl-2c .gap p{font-size:clamp(14px,.98vw,16.5px);line-height:1.45}
}

body.sl .sec>.wrap{width:100%;min-width:0}
body.sl .sl-head,body.sl .sl-body,body.sl .sl-grade{min-width:0;max-width:100%}
/* ===== DECK: uma ideia por tela; cada tela cabe inteira na janela (PC e celular). Mesma identidade: preto, ouro, vermelho do clube, Bebas. ===== */
html.dkh,body.dk{height:100%;overflow:hidden;background:#0d0d0d}
body.dk{--pad:clamp(14px,2.6vw,56px);--barH:clamp(46px,5.4vh,60px);--navH:clamp(46px,5.6vh,60px);margin:0;font-size:16px;overscroll-behavior:none}
@media (min-aspect-ratio:1/1){body.dk{--u0:min(.82vw,1.7vh)}}

body.dk .topbar{display:none}
body.dk main{padding:0;height:100%}
body.dk #page{height:100%}
.dk-stage{position:fixed;inset:0;overflow:hidden}
.dk-s{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateX(3vw);transition:opacity .35s ease,transform .45s ease,visibility 0s .45s;
  padding:calc(var(--barH) + 10px) var(--pad) calc(var(--navH) + 8px);background:#0d0d0d}

.dk-h{flex:none;margin-bottom:calc(var(--u)*1.6)}
.dk-h .kick{font:700 calc(var(--u)*1.05)/1.2 var(--body);letter-spacing:.22em;color:var(--gold);text-transform:uppercase;margin:0 0 calc(var(--u)*.6)}
.dk-h h2{font:400 calc(var(--u)*5.4)/.95 var(--disp);letter-spacing:.5px;color:#fff;border:0;padding:0;margin:0;text-wrap:balance;max-width:24ch}
.dk-h h2::before{content:"";display:block;width:calc(var(--u)*4);height:calc(var(--u)*.45);background:var(--red);margin-bottom:calc(var(--u)*1);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.dk-b{flex:1;min-height:0;display:flex;gap:calc(var(--u)*2.4);overflow:auto;-webkit-overflow-scrolling:touch}
.dk-s.dk-capa{padding-top:calc(var(--barH) + 6px)}

.dk-b .note{font:400 calc(var(--u)*1.2)/1.45 var(--body);color:var(--soft);margin:calc(var(--u)*.8) 0 0;max-width:none}

/* capa: resumo e os dois jogadores */
.dk-capa{background:radial-gradient(1200px 700px at 85% 25%,rgba(208,59,59,.32),transparent 62%),radial-gradient(900px 520px at 5% 100%,rgba(232,184,75,.10),transparent 60%),#0d0d0d}

n el centro del campo. En el último partido, Javi Mier y Palmberg formaron el doble pivote."}, "r": {"pt": "Peça: Felipe Amaral, volante de saída e de passe longo, que pode ser o primeiro ou o segundo volante", "br": "Peça: Felipe Amaral, volante de saída e de passe longo, que pode ser o primeiro ou o segundo volante", "en": "Piece: Felipe Amaral, a long-passing build-up holding midfielder who can play as the first or the second pivot", "es": "Pieza: Felipe Amaral, pivote de salida y de pase largo, que puede jugar como primer o segundo pivote"}}]}, "tecnico": {"kick": {"pt": "O treinador", "br": "O técnico", "en": "The coach", "es": "El entrenador"}, "h": {"pt": "SERGI GUILLÓ: POSSE PARA FAZER DANO", "br": "SERGI GUILLÓ: POSSE PARA FAZER DANO", "en": "SERGI GUILLÓ: POSSESSION TO HURT", "es": "SERGI GUILLÓ: POSESIÓN PARA HACER DAÑO"}, "lead": {"pt": "Sergi Guilló, de 35 anos, voltou ao Real Murcia em maio de 2026, onde foi jogador e adjunto, depois de dirigir o Huesca na Segunda División. Em 10 jogos de liga tem 6 vitórias, 1 empate e 3 derrotas e usou o 4-3-3 em 6.", "br": "Sergi Guilló, de 35 anos, voltou ao Real Murcia em maio de 2026, onde foi jogador e auxiliar técnico, depois de dirigir o Huesca na Segunda División. Em 10 jogos de liga tem 6 vitórias, 1 empate e 3 derrotas e usou o 4-3-3 em 6.", "en": "Sergi Guilló, 35, returned to Real Murcia in May 2026, where he was a player and assistant coach, after managing Huesca in the Segunda División. In 10 league games he has 6 wins, 1 draw and 3 defeats, and used a 4-3-3 in 6.", "es": "Sergi Guilló, de 35 años, volvió al Real Murcia en mayo de 2026, donde fue jugador y segundo entrenador, tras dirigir al Huesca en Segunda División. En 10 partidos de liga suma 6 victorias, 1 empate y 3 derrotas y ha utilizado el 4-3-3 en 6 de ellos."}, "paras": [{"pt": "A ideia dele, depois do 1–0 em Antequera: a posse tem de servir para atacar, não ser um fim em si mesma. Citou Javi Moreno, Jorquera e Chema a jogar entre linhas, para virar e acelerar o jogo.", "br": "A ideia dele, depois do 1–0 em Antequera: a posse tem de servir para atacar, não ser um fim em si mesma. Citou Javi Moreno, Jorquera e Chema jogando entre linhas, para virar e acelerar o jogo.", "en": "His idea, after the 1–0 at Antequera: possession has to be used to attack, not be an end in itself. He named Javi Moreno, Jorquera and Chema playing between the lines, to turn and speed up the game.", "es": "Su idea, tras el 1–0 en Antequera: la posesión debe servir para atacar, no ser un fin en sí misma. Citó a Javi Moreno, Jorquera y Chema jugando entre líneas, para girar y acelerar el juego."}, {"pt": "Se a posse tem de fazer dano, o 4Data mede onde ainda falta: 11º em passes decisivos e 13º em remates, com os médios fora do golo.", "br": "Se a posse tem de fazer dano, o 4Data mede onde ainda falta: 11º em passes decisivos e 13º em finalizações, com os meio-campistas fora do gol.", "en": "If possession has to hurt, 4Data measures where it is still missing: 11th for key passes and 13th for shots, with the midfielders far from goal.", "es": "Si la posesión tiene que hacer daño, 4Data mide dónde todavía falta: 11º en pases clave y 13º en disparos, con los centrocampistas lejos del gol."}, {"pt": "O desenho muda conforme o jogo: 4-3-3 em 6 jogos, mas também 5-4-1, 4-4-2, 3-4-3 e, no último, 4-2-3-1 com duplo pivô e um 10. Os três jogadores deste documento podem jogar em mais de um deles (ver «O meio-campo de três»).", "br": "O desenho muda conforme o jogo: 4-3-3 em 6 jogos, mas também 5-4-1, 4-4-2, 3-4-3 e, no último, 4-2-3-1 com duplo pivô e um 10. Os três jogadores deste documento podem jogar em mais de um deles (ver «O meio-campo de três»).", "en": "The shape changes with the game: a 4-3-3 in 6 games, but also a 5-4-1, 4-4-2, 3-4-3 and, in the last one, a 4-2-3-1 with a double pivot and a number 10. The three players in this document can play in more than one of them (see “The three-man midfield”).", "es": "El dibujo cambia según éries A e B 2026, é o 8º em passes longos certos por 90 (3,48) e o 12º em acerto entre os 66 com 30 ou mais passes longos (67,4%, contra mediana de 57,6%). Só 4 volantes tentam mais e acertam mais do que ele ao mesmo tempo, todos da Série A: Allan, Willian Arão, Neto Moura, Marlon Freitas. Na Série B, nenhum. Foi convocado para a Seleção Brasileira Sub-20 em novembro de 2022. No Real Murcia, é o construtor de saída que falta.", "br": "É um especialista no passe longo. Entre os 69 volantes das Séries A e B 2026, é o 8º em passes longos certos por 90 (3,48) e o 12º em acerto entre os 66 com 30 ou mais passes longos (67,4%, contra mediana de 57,6%). Só 4 volantes tentam mais e acertam mais do que ele ao mesmo tempo, todos da Série A: Allan, Willian Arão, Neto Moura, Marlon Freitas. Na Série B, nenhum. Foi convocado para a Seleção Brasileira Sub-20 em novembro de 2022. No Real Murcia, é o construtor de saída que falta.", "en": "He is a long-pass specialist. Among the 69 holding midfielders in the 2026 Série A and B, he ranks 8th for accurate long passes per 90 (3.48) and 12th for accuracy among the 66 with 30 or more long passes (67.4%, against a median of 57.6%). Only 4 holding midfielders attempt more and complete a higher share at the same time, all from the Série A: Allan, Willian Arão, Neto Moura, Marlon Freitas. In the Série B, none. He was called up to the Brazil U-20 squad in November 2022. At Real Murcia, he is the build-up player the team lacks.", "es": "Es un especialista en el pase largo. Entre los 69 pivotes de la Série A y B 2026, es el 8º en pases largos acertados por 90 (3,48) y el 12º en acierto entre los 66 con 30 o más pases largos (67,4%, frente a una mediana del 57,6%). Solo 4 pivotes intentan más y aciertan más que él a la vez, todos de la Série A: Allan, Willian Arão, Neto Moura, Marlon Freitas. En la Série B, ninguno. Fue convocado por la selección brasileña sub-20 en noviembre de 2022. En el Real Murcia, es el constructor de salida que falta."},   slide('falta', 'dk-g4', D.lacunas.kick, D.lacunas.h, `<div class="dk-grid c4 gp">${D.lacunas.itens.map((g, i) => `<div class="gap"><b class="nn">${String(i + 1).padStart(2, '0')}</b><h4>${t(g.t)}</h4><p>${t(g.p)}</p><div class="resp">${t(g.r)}</div></div>`).join('')}</div>`);
  // 5 o treinador
  slide('tecnico', 'dk-2c', T.kick, T.h, `<div class="dk-col"><div class="rl">${T.paras.map(x => `<p>${t(x)}</p>`).join('')}</div></div><div class="dk-col">${(T.barras || []).map(c => `${h3(c.titulo)}${bars(c)}${nota(c.nota)}`).join('')}<p class="note">${t(T.leitura)}</p></div>`);

  // peças
  const perfil = (p, idn, kickAcao) => slide(idn, 'dk-perfil', p.kick, p.nome, `<div class="dk-col dk-fig"><div class="portrait"><img src="${p.foto}" alt="${t(p.nome)}"></div><p class="pap">${t(p.papel)}</p>${basicos(p.basicos)}</div><div class="dk-col"><p class="l">${t(p.lead)}</p>${kpis(p.kpis)}${(p.cen || []).length && p === D.pecas[0] ? `<div class="cen">${p.cen.map(c => `<div><b>${t(c[0])}</b>${t(c[1])}</div>`).join('')}</div>` : ''}</div>`);
  perfil(F, 'f1');
  const disp = bl(F, 'dispersao'), lan = bl(F, 'lancamentos'), vid = bl(F, 'video');
  slide('f2', 'dk-full', F.kick, F.nome, `<div class="dk-chart">${dispersao(disp)}</div>`);
  slide('f3', 'dk-full dk-lan', F.kick, F.nome, lancamentos(lan));
  slide('f4', 'dk-2c', F.kick, F.nome, `<div class="dk-col">${mapaAcoes(F.mapa)}</div><div class="dk-col">${mapaPosicoes(F.posicoes)}</div>`);
  slide('f5', 'dk-full dk-vid', F.kick, F.nome, `<div class="dk-video">${vid ? video(vid) : ''}${F.video ? video(F.video) : ''}</div>`);
  perfil(G, 'g1');
  slide('g2', 'dk-2c', G.kick, G.nome, G.charts.map(c => `<div class="dk-col">${h3(c.titulo)}${bars(c)}${nota(c.nota)}</div>`).join('') + '');
  slide('g3', 'dk-2c dk-pos', G.kick, G.nome, `<div class="dk-col">${mapaPosicoes(G.posicoes)}</div><div class="dk-col">${(G.cen || []).map(c => `<div class="cen1"><b>${t(c[0])}</b><p>${t(c[1])}</p></div>`).join('')}${(G.extra || []).map(x => `<p class="l">${t(x)}</p>`).join('')}${G.video ? video(G.video) : ''}</div>`);

  // o trio: um cartão por jogador
  const rot = E.cab;
  slide('trio', 'dk-g3', E.kick, E.h, `<p class="blead">${t(E.lead)}</p><div class="dk-grid c3 trio">${E.linhas.map(r => `<div class="tr3"><div class="tn">${av(r.foto, 56)}<b>${t(r.nome)}</b></div><dl><dt>${t(rot[1])}</dt><dd>${t(r.add)}</dd><dt>${t(rot[2])}</dt><dd>${t(r.vaga)}</dd><dt>${t(rot[3])}</dt><dd>${t(r.par)}</dd><dt>${t(rot[4])}</dt><dd>${t(r.dif)}</dd></dl></div>`).join('')}</div><p class="dk-note">${t(E.nota)}</p>`);
  slide('formacoes', 'dk-full dk-fo', FO.kick, FO.h, `<div class="fleg">${FO.legenda.map(l => `<span><i style="background:${FCOR[l[0]]}"></i>${t(l[1])}</span>`).join('')}<span><i style="background:#35352f;border:1px solid #55554f"></i>${t(FO.outros)}</span></div><div class="fgrid">${FO.itens.map(fpitch).join('')}</div>`);
  slide('palmberg', 'dk-2c dk-pal', K.kick, K.h, `<div class="dk-col"><p class="blead">${t(K.lead)}</p><div class="cart">${K.cards.map(c => `<div class="cc">${av(c.foto, 96)}<div><h4>${c.nome}</h4><div class="cmeta">${t(c.meta)}</div><div class="cclub">${t(c.clube)}</div><p>${t(c.l)}</p></div></div>`).join('')}</div>${nota(K.nota)}</div><div class="dk-col"><div class="fleg">${FO.legenda.map(l => `<span><i style="background:${FCOR[l[0]]}"></i>${t(l[1])}</span>`).join('')}</div><div class="fgrid one">${fpitch(FO.itens[0])}</div></div>`);
  slide('passos', 'dk-g4 big', D.passos.kick, D.passos.h, `<div class="dk-grid c4 pas">${D.passos.itens.map((x, i) => `<div class="gap"><b class="nn">${String(i + 1).padStart(2, '0')}</b><p>${t(x)}</p></div>`).join('')}</div>${nota(D.passos.nota)}`);
  slide('metodo', 'dk-met', D.metodo.kick, D.metodo.h, `<div class="dk-mt">${D.metodo.itens.map(x => `<p>${t(x)}</p>`).join('')}</div>`);
  dkIds = S.map(x => /id="([^"]+)"/.exec(x)[1]);
  return `<div class="dk-stage" id="dkStage">${S.join('')}</div>`;
}


/* celular (vertical): as telas densas viram 2 ou 3, uma ideia por tela; gira o aparelho e volta ao formato largo */
function dkSplit() {
  if (!matchMedia('(max-aspect-ratio:1/1)').matches) return;
  const corta = (s, partes) => {
    partes = partes.filter(p => p.length); if (partes.length < 2) return;
    const hd = s.querySelector('.dk-h'), b = s.querySelector('.dk-b'); let ant = s;
    partes.forEach((nos, i) => {
      let sec = s;
      if (i > 0) { sec = s.cloneNode(false); sec.id = s.id + '_' + (i + 1); sec.appendChild(hd.cloneNode(true)); sec.appendChild(b.cloneNode(false)); ant.after(sec); }
      const corpo = sec.querySelector('.dk-b'); nos.forEach(n => corpo.appendChild(n));
      sec.querySelector('.dk-h h2').insertAdjacentHTML('beforeend', ` <small class="pt">${i + 1}/${partes.length}</small>`); ant = sec;
    });
  };
  const get = id => document.getElementById(id);
  let s = get('falta');
  if (s) { const b = s.querySelector('.dk-b'), g = b.querySelector('.dk-grid'), it = [...g.children], g2 = g.cloneNode(false); it.slice(2).forEach(n => g2.appendChild(n)); corta(s, [[g], [g2]]); }
  s = get('trio');
  if (s) { const b = s.querySelector('.dk-b'), g = b.querySelector('.dk-grid'), it = [...g.children], lead = b.querySelector('.blead'), nota = b.querySelector('.dk-note'), g2 = g.cloneNode(false), g3 = g.cloneNode(false);
    g2.appendChild(it[1]); g3.appendChild(it[2]); corta(s, [[lead, g], [g2], [g3, nota]]); }
  ['f1', 'g1', 'f4', 'g2', 'g3', 'palmberg'].forEach(id => { const x = get(id); if (x) corta(x, [...x.querySelector('.dk-b').children].map(c => [c])); });
}

function dkChrome() {
  if (!document.getElementById('dkBar')) {
    document.body.insertAdjacentHTML('afterbegin', `<div class="dk-bar" id="dkBar"><div class="sl-tags"><span class="sl-t a"><img src="assets/escudos/${DOC.chave}.png" alt=""><span class="tx"></span></span><span class="sl-t b" id="dkSec"></span><span class="sl-t c" id="dkCnt"></span></div><div class="sl-r" id="dkR"><button type="button" class="sl-idx-b" id="dkIdxB" aria-haspopup="dialog"><span id="dkIdxT"></span> <b id="dkIdxN"></b></button></div></div>
      <div class="dk-nav" id="dkNav"><button type="button" id="dkPrev" aria-label="Anterior">‹</button><div class="dk-dots" id="dkDots"></div><button type="button" id="dkNext" aria-label="Seguinte">›</button></div>
      <div class="sl-idx" id="dkIdx" role="dialog" aria-modal="true"><h3 id="dkIdxH"></h3><div class="sl-idx-g" id="dkIdxG"></div><div id="dkLangsM"></div></div><button type="button" class="sl-idx-x" id="dkX"></button>`);
    document.getElementById('dkIdxB').onclick = () => dkIndice(true); document.getElementById('dkX').onclick = () => dkIndice(false);
    document.getElementById('dkPrev').onclick = () => dkVai(dkI - 1); document.getElementById('dkNext').onclick = () => dkVai(dkI + 1);
    document.getElementById('dkIdx').addEventListener('click', e => { if (e.target.id === 'dkIdx') dkIndice(false); });
    document.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey || e.target.matches('input,textarea,select,video')) return;
      if (e.key === 'Escape') dkIndice(false);
      else if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); dkVai(dkI + 1); }
      else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); dkVai(dkI - 1); }
      else if (e.key === 'Home') dkVai(0); else if (e.key === 'End') dkVai(dkIds.length - 1);
    });
    let x0 = null, y0 = null;
    document.addEventListener('touchstart', e => { if (e.target.closest('.tw,video,svg.scat,.dk-mt,.dk-b')) { const el = e.target.closest('.dk-b'); } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive: true});
    document.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6 && !e.target.closest('video')) dkVai(dkI + (dx < 0 ? 1 : -1)); }, {passive: true});
    window.addEventListener('hashchange', () => { const i = dkIds.indexOf(location.hash.slice(1)); if (i >= 0 && i !== dkI) dkVai(i, true); });
    matchMedia('(max-width:760px)').addEventListener('change', dkLangs);
    matchMedia('(max-aspect-ratio:1/1)').addEventListener('change', () => { const id = dkIds[dkI]; render(); const k = dkIds.indexOf(id); const base = id.replace(/_\d+$/, ''); dkVai(k >= 0 ? k : Math.max(0, dkIds.indexOf(base)), true); });
  }
  document.querySelector('#dkBar .sl-t.a .tx').textContent = '4ComM × ' + DOC.clube_nome;
  document.getElementById('dkIdxT').textContent = dkU('indice'); document.getElementById('dkIdxN').textContent = dkIds.length;
  document.getElementById('dkIdxH').textContent = dkU('indice'); document.getElementById('dkX').textContent = dkU('fechar') + ' ✕';
  document.getElementById('dkPrev').setAttribute('aria-label', dkU('ant')); document.getElementById('dkNext').setAttribute('aria-label', dkU('prox'));
  document.getElementById('dkIdxG').innerHTML = dkIds.map((id, i) => `<a href="#${id}" data-i="${i}"><b>${String(i + 1).padStart(2, '0')}</b><span>${dkT(id)}</span></a>`).join('');
  document.querySelectorAll('#dkIdxG a').forEach(a => a.addEventListener('click', e => { e.preventDefault(); dkIndice(false); dkVai(+a.dataset.i); }));
  document.getElementById('dkDots').innerHTML = dkIds.map((id, i) => `<i data-i="${i}" title="${dkT(id)}"></i>`).join('');
  document.querySelectorAll('#dkDots i').forEach(d => d.addEventListener('click', () => dkVai(+d.dataset.i)));
  dkLangs();
}
function dkLangs() { const l = document.querySelector('.langs'); if (!l) return; (matchMedia('(max-width:760px)').matches ? document.getElementById('dkLangsM') : document.getElementById('dkR')).prepend(l); }
function dkFit() {
  const s = document.querySelector('.dk-s.on'); if (!s) return; const b = s.querySelector('.dk-b'); if (!b) return;
  const minF = matchMedia('(max-aspect-ratio:1/1)').matches ? .74 : .8;
  let f = 1; s.style.setProperty('--fit', f); s.classList.remove('rola');
  let guard = 0;
  while (b.scrollHeight - b.clientHeight > 2 && f > minF && guard++ < 30) { f = Math.max(minF, +(f - .03).toFixed(2)); s.style.setProperty('--fit', f); }
  s.classList.toggle('rola', b.scrollHeight - b.clientHeight > 2);
  b.onscroll = () => { s.classList.toggle('rola', b.scrollHeight - b.clientHeight - b.scrollTop > 6); };
}
window.addEventListener('resize', () => { clearTimeout(window.__dkR); window.__dkR = setTimeout(dkFit, 120); });
function dkIndice(on) { document.getElementById('dkIdx').classList.toggle('on', on); document.body.classList.toggle('sl-open', on); if (on) document.querySelector('#dkIdxG a.on, #dkIdxG a').focus(); }
function dkVai(i, semHash) {
  i = Math.max(0, Math.min(dkIds.length - 1, i));
  const ss = document.querySelectorAll('.dk-s'); ss.forEach((s, k) => { s.classList.toggle('on', k === i); s.classList.toggle('antes', k < i); s.querySelectorAll('video').forEach(v => { if (k !== i) v.pause(); }); if (k === i) { const b = s.querySelector('.dk-b'); if (b) b.scrollTop = 0; } });
  dkI = i;
  document.getElementById('dkSec').textContent = dkT(dkIds[i]);
  document.getElementById('dkCnt').textContent = String(i + 1).padStart(2, '0') + '/' + String(dkIds.length).padStart(2, '0');
  document.querySelectorAll('#dkDots i').forEach((d, k) => { d.classList.toggle('on', k === i); d.classList.toggle('feito', k < i); });
  document.querySelectorAll('#dkIdxG a').forEach((a, k) => a.classList.toggle('on', k === i));
  document.getElementById('dkPrev').disabled = i === 0; document.getElementById('dkNext').disabled = i === dkIds.length - 1;
  dkFit();
  if (!semHash) { try { history.replaceState(null, '', '#' + dkIds[i]); } catch (e) {} }
}
document.addEventListener('click', e => { const a = e.target.closest('[data-go]'); if (a) { e.preventDefault(); dkVai(dkIds.indexOf(a.dataset.go)); } });

const _renderDk = render;
render = function () { _renderDk(); dkSplit(); dkIds = [...document.querySelectorAll('.dk-s')].map(x => x.id); dkChrome(); const h = dkIds.indexOf(location.hash.slice(1)); dkVai(h >= 0 && !window.__dkIni ? h : dkI, true); window.__dkIni = true; };
render();

</script>
</body>
